---
- name: Resolve the exact registered target before making any instance connection
  aap_read_instance:
    instance_key: "{{ aap_instance_key | default(aap_instance_route.vm_name | default('')) }}"
    expected_route: "{{ aap_instance_route | default(omit) }}"
    allow_retired: "{{ aap_allow_retired_instance | default(false) | bool }}"
    read_related_resources: "{{ aap_read_related_resources | default(false) | bool }}"
  register: aap_registered_target
  no_log: true

- name: Refuse conflicting caller-supplied target names, addresses or URLs
  ansible.builtin.assert:
    that:
      - vm_name is not defined or vm_name == aap_registered_target.instance_route.vm_name
      - vm_ip is not defined or vm_ip == aap_registered_target.instance_route.vm_ip
      - aap_hostname is not defined or aap_hostname == aap_registered_target.instance_route.aap_hostname
      - aap_target_hostname is not defined or aap_target_hostname == aap_registered_target.instance_route.aap_hostname
    fail_msg: Select the registered instance key; its protected route determines all connection targets.
  no_log: true

- name: Use only the registered instance's complete connection handoff
  ansible.builtin.set_fact:
    aap_instance_route: "{{ aap_registered_target.instance_route }}"
    aap_instance_key: "{{ aap_registered_target.instance_route.vm_name }}"
    vm_name: "{{ aap_registered_target.instance_route.vm_name }}"
    vm_ip: "{{ aap_registered_target.instance_route.vm_ip }}"
    aap_hostname: "{{ aap_registered_target.instance_route.aap_hostname }}"
    aap_target_hostname: "{{ aap_registered_target.instance_route.aap_hostname }}"
    aap_instance_resources: "{{ aap_registered_target.instance_resources | default({}) }}"
    aap_related_resource_proof: "{{ aap_registered_target.related_resource_proof | default({}) }}"
  no_log: true
