---
- name: Remove the selected unchanged v3 DNS record ID
  ansible.builtin.uri:
    url: "https://api.godaddy.com/v3/domains/zones/{{ vault_domain | urlencode }}/dns-records/{{ aap_dns_retire_individual.recordId | urlencode | replace('/', '%2F') }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ vault_godaddy_api_token }}"
    status_code: [204, 404]
    validate_certs: true
    follow_redirects: none
    timeout: 30
  delegate_to: localhost
  become: false
  register: aap_dns_retire_delete
  changed_when: aap_dns_retire_delete.status == 204
  no_log: false
