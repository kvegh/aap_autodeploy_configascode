---
# Only explicitly reviewed capture image values reference this trusted binding.
# Never rewrite foreign image names or infer an image from a Source Hub URL.
- name: Require the existing selected receiver bearer before resolving its native EE
  ansible.builtin.assert:
    that:
      - aap_hostname is string
      - (aap_hostname | aap_https_origin) | length == 2
      - aap_token is string
      - aap_token | length > 0
      - aap_validate_certs | default(true) | bool
    fail_msg: Resolve the shared EE only through the selected receiver's authenticated TLS API.
  no_log: true

- name: Resolve the exact receiver-owned shared native execution environment without changing it
  ansible.controller.execution_environment:
    name: ee-proj-aap-cac
    state: exists
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ aap_token }}"
    validate_certs: true
  register: cac_shared_native_ee
  no_log: true

- name: Read back the resolved native EE from this receiver
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/controller/v2/execution_environments/{{ cac_shared_native_ee.id }}/"
    headers:
      Authorization: "Bearer {{ aap_token }}"
    validate_certs: true
    follow_redirects: none
    status_code: 200
  register: cac_shared_native_ee_definition
  no_log: true

- name: Require an immutable local-Hub image and an existing native credential relationship
  ansible.builtin.assert:
    that:
      - cac_shared_native_ee_definition.json.id == cac_shared_native_ee.id
      - cac_shared_native_ee_definition.json.name == 'ee-proj-aap-cac'
      - >-
        cac_shared_native_ee_definition.json.image is match('^' ~ ((aap_hostname | urlsplit('netloc')) | regex_escape) ~
        '/ee-proj-aap-cac@sha256:[a-f0-9]{64}$')
      - cac_shared_native_ee_definition.json.credential is integer
      - cac_shared_native_ee_definition.json.credential > 0
    fail_msg: Prepare this receiver's native shared EE with its own immutable Hub image before importing reviewed projects.
  no_log: true

- name: Read only the shared EE registry credential's native public binding
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/controller/v2/credentials/{{ cac_shared_native_ee_definition.json.credential }}/"
    headers:
      Authorization: "Bearer {{ aap_token }}"
    validate_certs: true
    follow_redirects: none
    status_code: 200
  register: cac_shared_native_registry
  no_log: true

- name: Require the dedicated receiver-local registry credential with TLS verification
  ansible.builtin.assert:
    that:
      - cac_shared_native_registry.json.id == cac_shared_native_ee_definition.json.credential
      - cac_shared_native_registry.json.name == 'Project AAP CaC EE registry'
      - cac_shared_native_registry.json.inputs.host in [aap_hostname, aap_hostname | urlsplit('netloc')]
      - cac_shared_native_registry.json.inputs.verify_ssl is sameas true
    fail_msg: The shared EE must use the dedicated native registry credential for this receiver's own Hub with TLS verification.
  no_log: true

- name: Require the Orchestrator native EE to agree with its independently verified build
  ansible.builtin.assert:
    that:
      - aap_ee_build_result.verified is sameas true
      - aap_ee_build_result.image == cac_shared_native_ee_definition.json.image
    fail_msg: The receiver's native shared EE differs from the verified Orchestrator build; complete its normal base EE configuration first.
  when: (cac_project_contract | default({})).project_id | default('') == 'automation-orchestrator'
  no_log: true

- name: Bind only explicit reviewed image templates to this receiver's native immutable image
  ansible.builtin.set_fact:
    aap_shared_execution_image: "{{ cac_shared_native_ee_definition.json.image }}"
  no_log: true
