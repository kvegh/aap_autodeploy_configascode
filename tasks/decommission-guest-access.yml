---
- name: Require an explicit decommission permission phase
  ansible.builtin.assert:
    that: aap_decommission_guest_access_phase in ['preflight', 'apply']
  no_log: true

- name: Inspect and plan selected guest permission retirement
  when: aap_decommission_guest_access_phase == 'preflight'
  block:
    - name: Bind only the selected CaC transaction and pinned trust
      ansible.builtin.set_fact:
        aap_isolation_hypervisor: '{{ aap_hypervisor_pin }}'
        aap_isolation_trust_file: '{{ aap_hypervisor_trust.path }}'
      no_log: true

    - name: Prepare the pinned native source and lock for ownership inspection
      ansible.builtin.include_tasks: aap-isolation-prepare.yml

    - name: Inspect all selected domain identities without changing them
      ansible.builtin.command:
        argv: [virsh, -c, 'qemu:///system', dumpxml, '{{ item.name }}']
      loop: '{{ aap_retirement.domains }}'
      when: item.name in aap_retirement_domains.stdout_lines
      register: aap_decommission_guest_xml_capture
      changed_when: false
      check_mode: false
      no_log: true

    - name: Initialize selected domain and network readback
      ansible.builtin.set_fact:
        aap_decommission_guest_xmls: {}
        aap_decommission_guest_network_xmls: {}
        aap_decommission_persistent_guest_xmls: {}
      no_log: true

    - name: Inspect selected persistent domain identities without changing them
      ansible.builtin.command:
        argv: [virsh, -c, 'qemu:///system', dumpxml, '{{ item.name }}', --inactive]
      loop: '{{ aap_retirement.domains }}'
      when: item.name in aap_retirement_domains.stdout_lines
      register: aap_decommission_persistent_guest_capture
      changed_when: false
      check_mode: false
      no_log: true

    - name: Retain exact persistent selected domain readback
      ansible.builtin.set_fact:
        aap_decommission_persistent_guest_xmls: >-
          {{ aap_decommission_persistent_guest_xmls | combine({item.item.name: item.stdout}) }}
      loop: '{{ aap_decommission_persistent_guest_capture.results }}'
      when: not item.skipped | default(false)
      no_log: true

    - name: Retain exact selected domain readback in protected job variables
      ansible.builtin.set_fact:
        aap_decommission_guest_xmls: '{{ aap_decommission_guest_xmls | combine({item.item.name: item.stdout}) }}'
      loop: '{{ aap_decommission_guest_xml_capture.results }}'
      when: not item.skipped | default(false)
      no_log: true

    - name: Resolve only the selected guests recorded network names
      ansible.builtin.set_fact:
        aap_decommission_guest_network_names: >-
          {{ aap_decommission_guest_xmls | aap_decommission_guest_networks(aap_instance_resources) }}
      no_log: true

    - name: Inspect those exact active and persistent libvirt networks
      ansible.builtin.include_tasks: decommission-network-readback.yml

    - name: Plan removal of only verified selected guest identities
      ansible.builtin.set_fact:
        aap_decommission_guest_access_plan: >-
          {{ aap_hypervisor_pin | aap_hypervisor_isolation_policy(
               aap_hypervisor_isolation_https_clients | default([]),
               aap_hypervisor_isolation_protected_ipv4 | default([]),
               aap_hypervisor_isolation_host_clients | default([]),
               aap_hypervisor_isolation_released_clients | default([]),
           aap_hypervisor_isolation_http_clients | default([])) |
             aap_decommission_guest_access_plan(aap_retirement, aap_instance_route, aap_instance_resources,
               aap_decommission_guest_xmls, aap_decommission_guest_network_xmls,
               none,
               aap_related_resource_proof | default(none), aap_decommission_persistent_guest_xmls) }}
      no_log: true

    - name: Plan removal of only exact saved DHCP and DNS host reservations
      ansible.builtin.set_fact:
        aap_decommission_reservations: >-
          {{ aap_decommission_guest_network_xmls |
             aap_decommission_reservation_plan(aap_instance_route, aap_instance_resources,
               aap_decommission_guest_xmls, aap_decommission_guest_access_plan) }}
      no_log: true

    - name: Expose the protected policy handoff for canonical source retirement
      ansible.builtin.set_fact:
        aap_decommission_isolation_retirement:
          previous_policy: '{{ aap_decommission_guest_access_plan.previous_policy }}'
          desired_policy: '{{ aap_decommission_guest_access_plan.desired_policy }}'
          identities: '{{ aap_decommission_guest_access_plan.identities }}'
      no_log: true

    - name: Verify the complete native policy against the exact CaC retirement candidates
      ansible.builtin.include_tasks: aap-isolation-observe.yml
      vars:
        aap_isolation_previous_policy: '{{ aap_decommission_guest_access_plan.previous_policy }}'
        aap_isolation_desired_policy: '{{ aap_decommission_guest_access_plan.desired_policy }}'

    - name: Plan exact selected application removal while its CaC owner still exists
      ansible.builtin.include_tasks: decommission-aiops-access.yml

    - name: Require the existing isolation service active and enabled
      ansible.builtin.command:
        argv: [systemctl, '{{ item }}', hactar-recovery-isolation.service]
      loop: [is-active, is-enabled]
      changed_when: false
      check_mode: false
      no_log: true

    - name: Check only the exact owned runtime rich rules before shutdown
      ansible.builtin.command:
        argv: [firewall-cmd, --zone=libvirt, '--query-rich-rule={{ item }}']
      loop: '{{ aap_decommission_rules_to_remove }}'
      register: aap_decommission_runtime_rule_preflight
      failed_when: aap_decommission_runtime_rule_preflight.rc not in [0, 1]
      changed_when: false
      check_mode: false
      no_log: true

    - name: Check only the exact owned permanent rich rules before shutdown
      ansible.builtin.command:
        argv: [firewall-cmd, --permanent, --zone=libvirt, '--query-rich-rule={{ item }}']
      loop: '{{ aap_decommission_rules_to_remove }}'
      register: aap_decommission_permanent_rule_preflight
      failed_when: aap_decommission_permanent_rule_preflight.rc not in [0, 1]
      changed_when: false
      check_mode: false
      no_log: true

  always:
    - name: Release only this preflight's temporary lock and checkout
      ansible.builtin.include_tasks: aap-isolation-finish.yml

- name: Remove selected stopped guests permissions
  when: aap_decommission_guest_access_phase == 'apply'
  block:
    - name: Require successful protected preflight and a real execution
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - aap_decommission_isolation_retirement is mapping
          - aap_decommission_guest_access_plan is mapping
          - aap_decommission_selected_guests_stopped | default(false) | bool
      no_log: true

    - name: Prepare the pinned native source and lock for exact permission removal
      ansible.builtin.include_tasks: aap-isolation-prepare.yml

    - name: Refuse native policy changes made since the ownership preflight
      ansible.builtin.include_tasks: aap-isolation-observe.yml
      vars:
        aap_isolation_previous_policy: '{{ aap_decommission_guest_access_plan.previous_policy }}'
        aap_isolation_desired_policy: '{{ aap_decommission_guest_access_plan.desired_policy }}'

    - name: Plan exact selected application removal while its CaC owner still exists
      ansible.builtin.include_tasks: decommission-aiops-access.yml

    - name: Reinspect exact network reservations before selected record removal
      ansible.builtin.include_tasks: decommission-network-readback.yml

    - name: Refuse changed network ownership before exact reservation removal
      ansible.builtin.assert:
        that: >-
          aap_decommission_guest_network_xmls |
          aap_decommission_reservation_matches(aap_decommission_reservations, 'before')
      no_log: true

    - name: Remove only exact saved selected DHCP and DNS host records
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - net-update
          - '{{ item.network }}'
          - delete
          - '{{ item.kind }}'
          - '{{ item.xml }}'
          - "{{ '--config' if item.scope == 'persistent' else '--live' }}"
      loop: '{{ aap_decommission_reservations.reservations }}'
      changed_when: true
      no_log: true

    - name: Reinspect network definitions after exact selected record removal
      ansible.builtin.include_tasks: decommission-network-readback.yml

    - name: Verify selected reservations gone and unrelated network contents preserved
      ansible.builtin.assert:
        that: >-
          aap_decommission_guest_network_xmls |
          aap_decommission_reservation_matches(aap_decommission_reservations)
      no_log: true

    - name: Read only exact runtime rich rules immediately before retirement
      ansible.builtin.command:
        argv: [firewall-cmd, --zone=libvirt, '--query-rich-rule={{ item }}']
      loop: '{{ aap_decommission_rules_to_remove }}'
      register: aap_decommission_runtime_rules
      failed_when: aap_decommission_runtime_rules.rc not in [0, 1]
      changed_when: false
      no_log: true

    - name: Read only exact permanent rich rules immediately before retirement
      ansible.builtin.command:
        argv: [firewall-cmd, --permanent, --zone=libvirt, '--query-rich-rule={{ item }}']
      loop: '{{ aap_decommission_rules_to_remove }}'
      register: aap_decommission_permanent_rules
      failed_when: aap_decommission_permanent_rules.rc not in [0, 1]
      changed_when: false
      no_log: true

    - name: Apply the exact stopped-guest native firewall reduction
      block:
        - name: Disable only the selected CaC rich rules through the certified role
          ansible.builtin.include_role:
            name: redhat.rhel_system_roles.firewall
            apply:
              no_log: true
          vars:
            firewall:
              - zone: libvirt
                rich_rule: '{{ aap_decommission_rules_to_remove }}'
                state: disabled
                runtime: true
                permanent: true
            firewall_disable_conflicting_services: false

        - name: Verify exact selected runtime rich rules are absent before further deletion
          ansible.builtin.command:
            argv: [firewall-cmd, --zone=libvirt, '--query-rich-rule={{ item }}']
          loop: '{{ aap_decommission_rules_to_remove }}'
          register: aap_decommission_runtime_rule_absence
          failed_when: aap_decommission_runtime_rule_absence.rc != 1
          changed_when: false
          no_log: true

        - name: Verify exact selected permanent rich rules are absent before further deletion
          ansible.builtin.command:
            argv: [firewall-cmd, --permanent, --zone=libvirt, '--query-rich-rule={{ item }}']
          loop: '{{ aap_decommission_rules_to_remove }}'
          register: aap_decommission_permanent_rule_absence
          failed_when: aap_decommission_permanent_rule_absence.rc != 1
          changed_when: false
          no_log: true

        - name: Apply the complete reduced CaC through native Hactar tasks
          ansible.builtin.include_tasks: '{{ hactar_firewall_source_root }}/playbooks/tasks/replacement-isolation-apply.yml'
          vars:
            hactar_isolation_policy: '{{ aap_isolation_effective_desired_policy }}'

      rescue:
        - name: Initialize exact native rich-rule rollback from the protected queries
          ansible.builtin.set_fact:
            aap_decommission_native_rule_restore: []
          no_log: true

        - name: Retain only each selected rule's original runtime state
          ansible.builtin.set_fact:
            aap_decommission_native_rule_restore: >-
              {{ aap_decommission_native_rule_restore + [{'zone': 'libvirt', 'rich_rule': item.item,
                   'state': 'enabled' if item.rc == 0 else 'disabled', 'runtime': true, 'permanent': false}] }}
          loop: '{{ aap_decommission_runtime_rules.results }}'
          no_log: true

        - name: Retain only each selected rule's original permanent state
          ansible.builtin.set_fact:
            aap_decommission_native_rule_restore: >-
              {{ aap_decommission_native_rule_restore + [{'zone': 'libvirt', 'rich_rule': item.item,
                   'state': 'enabled' if item.rc == 0 else 'disabled', 'runtime': false, 'permanent': true}] }}
          loop: '{{ aap_decommission_permanent_rules.results }}'
          no_log: true

        - name: Restore only these exact native rule states through the certified role
          ansible.builtin.include_role:
            name: redhat.rhel_system_roles.firewall
            apply:
              no_log: true
          vars:
            firewall: '{{ aap_decommission_native_rule_restore }}'
            firewall_disable_conflicting_services: false

        - name: Restore only the complete current CaC rollback policy
          ansible.builtin.include_tasks: '{{ hactar_firewall_source_root }}/playbooks/tasks/replacement-isolation-apply.yml'
          vars:
            hactar_isolation_policy: '{{ aap_isolation_rollback_policy }}'

        - name: Stop before domain or disk removal after incomplete permission retirement
          ansible.builtin.fail:
            msg: Guest permission retirement failed; prior native policy was restored and selected guests remain stopped.
          no_log: false

  always:
    - name: Release only this removal's temporary native lock and public checkout
      ansible.builtin.include_tasks: aap-isolation-finish.yml
