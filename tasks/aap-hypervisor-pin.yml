---
- name: Verify pinned hypervisor trust and identity
  ansible.builtin.include_tasks: aap-hypervisor-identity.yml

- name: Require the complete persistent recovery isolation policy
  ansible.builtin.command:
    argv: [/usr/local/sbin/hactar-recovery-isolation, check]
    stdin: >-
      {{ aap_hypervisor_pin | aap_hypervisor_isolation_policy(
           aap_hypervisor_isolation_https_clients | default([]),
           aap_hypervisor_isolation_protected_ipv4 | default([]),
           aap_hypervisor_isolation_host_clients | default([]),
           aap_hypervisor_isolation_released_clients | default([]),
           aap_hypervisor_isolation_http_clients | default([])) | to_json }}
  changed_when: false
  check_mode: false
  no_log: true

- name: Require persistent isolation to be active and enabled
  ansible.builtin.command:
    argv: [systemctl, "{{ item }}", hactar-recovery-isolation.service]
  loop: [is-active, is-enabled]
  changed_when: false
  check_mode: false
  no_log: true
