---
- name: Require one explicitly pinned recovery hypervisor
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all | length == 1
      - aap_hypervisor_pin | aap_hypervisor_pin is mapping
      - ansible_host == aap_hypervisor_pin.address
    fail_msg: Use a single-host recovery inventory with independently verified hypervisor pins.
  no_log: true

- name: Allocate the job-local hypervisor trust file
  ansible.builtin.tempfile:
    state: file
    prefix: aap-hypervisor-known-hosts-
  delegate_to: localhost
  become: false
  register: aap_hypervisor_trust
  check_mode: false

- name: Install only the verified hypervisor SSH public keys
  ansible.builtin.copy:
    dest: "{{ aap_hypervisor_trust.path }}"
    content: |
      {% for key in aap_hypervisor_pin.host_keys %}
      {{ aap_hypervisor_pin.address }} {{ key }}
      [{{ aap_hypervisor_pin.address }}]:{{ aap_hypervisor_pin.port }} {{ key }}
      {% endfor %}
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true
  check_mode: false

- name: Enforce the pinned managed connection before any remote action
  ansible.builtin.set_fact:
    ansible_user: "{{ aap_hypervisor_pin.user }}"
    ansible_port: "{{ aap_hypervisor_pin.port }}"
    ansible_password: ''
    ansible_become_password: ''
    ansible_host_key_checking: true
    ansible_ssh_host_key_checking: true
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ aap_hypervisor_trust.path | quote }}
      {{ ansible_ssh_common_args | default('') }}
  no_log: true

- name: Verify the actual hypervisor identity before any reservation or disk write
  ansible.builtin.command:
    argv: [cat, /etc/machine-id]
  register: aap_live_hypervisor_identity
  changed_when: false
  check_mode: false
  failed_when: aap_live_hypervisor_identity.stdout | trim != aap_hypervisor_pin.machine_id
  no_log: true

- name: Require the complete persistent recovery isolation policy
  ansible.builtin.command:
    argv: [/usr/local/sbin/hactar-recovery-isolation, check]
    stdin: >-
      {{ aap_hypervisor_pin | aap_hypervisor_isolation_policy(
           aap_hypervisor_isolation_https_clients | default([]),
           aap_hypervisor_isolation_protected_ipv4 | default([])) | to_json }}
  changed_when: false
  check_mode: false
  no_log: true

- name: Require persistent isolation to be active and enabled
  ansible.builtin.command:
    argv: [systemctl, "{{ item }}", hactar-recovery-isolation.service]
  loop: [is-active, is-enabled]
  changed_when: false
  check_mode: false
  no_log: true
