- name: Inspect complete nginx configuration before unlinking any selected file
  ansible.builtin.command:
    argv:
    - /usr/sbin/nginx
    - -T
  changed_when: false
  check_mode: false
  register: aap_aiops_teardown_nginx_config
  no_log: false
- name: Refuse shared vhosts certificates or a changed publication owner
  ansible.builtin.assert:
    that: aap_aiops_teardown_nginx_config.stdout | aap_aiops_teardown_publications_owned(aap_retirement)
    quiet: true
  no_log: false
- name: Inspect exact selected publication paths without following links
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop: '{{ aap_retirement.nginx + aap_retirement.website_paths }}'
  register: aap_aiops_teardown_publication_paths
  no_log: false
- name: Refuse a linked selected publication path
  ansible.builtin.assert:
    that: not item.stat.islnk | default(false)
    quiet: true
  loop: '{{ aap_aiops_teardown_publication_paths.results | default([]) }}'
  no_log: false
- name: Inspect exact selected certificate renewal files
  ansible.builtin.stat:
    path: /etc/letsencrypt/renewal/{{ item }}.conf
    follow: false
    get_checksum: false
  loop: '{{ aap_retirement.certificates }}'
  register: aap_aiops_teardown_certificate_files
  no_log: false
- name: Refuse linked certificate renewal files
  ansible.builtin.assert:
    that: not item.stat.islnk | default(false)
    quiet: true
  loop: '{{ aap_aiops_teardown_certificate_files.results | default([]) }}'
  no_log: false
- name: Read exact selected certificate SANs before any publication deletion
  ansible.builtin.command:
    argv:
    - openssl
    - x509
    - -in
    - /etc/letsencrypt/live/{{ item.item }}/cert.pem
    - -noout
    - -ext
    - subjectAltName
  loop: '{{ aap_aiops_teardown_certificate_files.results | default([]) }}'
  when:
  - item.stat.exists
  register: aap_aiops_teardown_certificate_sans
  changed_when: false
  check_mode: false
  no_log: false
- name: Refuse shared or unexpected SAN identities
  ansible.builtin.assert:
    that:
    - item.stdout | regex_findall('DNS:([^,\s]+)') == [item.item.item]
    - item.stdout | regex_findall('(?:IP Address|URI|email):') | length == 0
    quiet: true
  loop: '{{ aap_aiops_teardown_certificate_sans.results | default([]) }}'
  when:
  - not item.skipped | default(false)
  no_log: false
