---
- name: Require exactly one captured base workflow when no direct workflow configuration was supplied
  ansible.builtin.assert:
    that:
      - controller_workflows_autodeploy is defined
      - controller_workflows_autodeploy is sequence
      - controller_workflows_autodeploy is not string
      - controller_workflows_autodeploy is not mapping
      - controller_workflows_autodeploy | length == 1
      - controller_workflows_autodeploy[0].name == 'Deploy Complete AAP'
    fail_msg: Supply the reviewed base workflow or its single encrypted AutoDeploy workflow definition.
  when: cac_workflow is not defined
  no_log: false

- name: Select only the captured workflow without applying the other AutoDeploy resources
  ansible.builtin.set_fact:
    cac_workflow: '{{ controller_workflows_autodeploy[0] }}'
  when: cac_workflow is not defined
  no_log: false

- name: Require the base deployment workflow organization
  ansible.builtin.assert:
    that:
      - cac_workflow is defined
      - cac_workflow is mapping
      - cac_workflow.organization is string
      - cac_workflow.organization | length > 0
    fail_msg: Supply the workflow organization; the four reviewed job templates retain their saved configuration inputs.
  no_log: false

- name: Refuse a captured graph that differs from the four reviewed deployment stages
  ansible.builtin.assert:
    that:
      - cac_workflow.workflow_nodes is not defined or cac_workflow.workflow_nodes == (lookup('ansible.builtin.template', 'templates/deployment-workflow-nodes.yml.j2') | from_yaml)
    fail_msg: The captured base workflow must contain only Create VM, Infrastructure, Install AAP and Base Configuration.
  no_log: false

- name: Create the success-only base AAP deployment graph
  ansible.controller.workflow_job_template:
    name: "{{ cac_workflow.name | default('Deploy Complete AAP') }}"
    organization: "{{ cac_workflow.organization }}"
    description: >-
      Deploy a fresh AAP and configure its shared base only. Use the separate
      explicit selector to install reviewed project and use-case CaC afterward.
    allow_simultaneous: false
    labels:
      - aap-autodeploy
    ask_variables_on_launch: false
    ask_inventory_on_launch: false
    ask_limit_on_launch: false
    ask_scm_branch_on_launch: false
    extra_vars:
      debug_logging: false
    survey_enabled: true
    survey_spec:
      name: Deployment diagnostics
      description: The VM name and internal target address are handed over automatically from Stage 01.
      spec:
        - question_name: Enable diagnostic logging
          question_description: Credential and token tasks remain protected.
          variable: debug_logging
          type: multiplechoice
          required: true
          choices: "false\ntrue"
          default: 'false'
          min: 0
          max: 1024
    workflow_nodes: "{{ lookup('ansible.builtin.template', 'templates/deployment-workflow-nodes.yml.j2') | from_yaml }}"
    destroy_current_nodes: true
    controller_host: "{{ aap_hostname | default(omit) }}"
    controller_oauthtoken: "{{ aap_token | default(omit) }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    state: present
  no_log: false
