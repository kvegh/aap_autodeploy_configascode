---
- name: Require existing verified flat guest provenance before native commands
  ansible.builtin.assert:
    that:
      - aap_isolation_app_owner.guest.schema_version == 1
      - aap_isolation_app_owner.guest.verified is sameas true
      - aap_isolation_app_owner.guest.instance_number | string is match('^[1-9][0-9]{0,62}$')
      - aap_isolation_app_owner.guest.vm_name == 'zabbix-v' ~ ('%02d' | format(aap_isolation_app_owner.guest.instance_number | int))
      - aap_isolation_app_owner.guest.address is match('^(?:10\.|192\.168\.|172\.(?:1[6-9]|2[0-9]|3[01])\.)')
      - aap_isolation_app_owner.guest.hypervisor_machine_id == aap_isolation_machine_id.stdout | trim
      - aap_isolation_app_owner.guest.vm_name is match('^zabbix-v[0-9]{2,}$')
      - aap_isolation_app_owner.guest.uuid is match('^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
      - aap_isolation_app_owner.guest.uuid != '00000000-0000-0000-0000-000000000000'
      - aap_isolation_app_owner.guest.disk == '/opt/vms/' ~ aap_isolation_app_owner.guest.vm_name ~ '.disk.qcow2'
      - aap_isolation_app_owner.guest.network is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,62}$')
      - aap_isolation_app_owner.guest.bridge in aap_isolation_hypervisor.isolation_bridges
      - aap_isolation_app_owner.guest.mac is match('^(?:[0-9a-f]{2}:){5}[0-9a-f]{2}$')
    quiet: true
  no_log: true

- name: Read the selected domain's actual UUID
  ansible.builtin.command:
    argv: [virsh, -c, 'qemu:///system', domuuid, '{{ aap_isolation_app_owner.guest.vm_name }}']
  register: aap_isolation_app_uuid
  changed_when: false
  check_mode: false
  no_log: true

- name: Read current and persistent disks of that exact domain
  ansible.builtin.command:
    argv: "{{ ['virsh', '-c', 'qemu:///system', 'domblklist', aap_isolation_app_owner.guest.vm_name, '--details'] + item }}"
  loop: [[], [--inactive]]
  environment:
    LC_ALL: C
  register: aap_isolation_app_disks
  changed_when: false
  check_mode: false
  no_log: true

- name: Read current and persistent interfaces of that exact domain
  ansible.builtin.command:
    argv: "{{ ['virsh', '-c', 'qemu:///system', 'domiflist', aap_isolation_app_owner.guest.vm_name] + item }}"
  loop: [[], [--inactive]]
  environment:
    LC_ALL: C
  register: aap_isolation_app_interfaces
  changed_when: false
  check_mode: false
  no_log: true

- name: Read the actual bridge assigned to the saved guest network
  ansible.builtin.command:
    argv: [virsh, -c, 'qemu:///system', net-info, '{{ aap_isolation_app_owner.guest.network }}']
  environment:
    LC_ALL: C
  register: aap_isolation_app_network
  changed_when: false
  check_mode: false
  no_log: true

- name: Read the native static guest reservation even when its domain is stopped
  ansible.builtin.command:
    argv: [virsh, -c, 'qemu:///system', net-dumpxml, '{{ aap_isolation_app_owner.guest.network }}', --inactive]
  environment:
    LC_ALL: C
  register: aap_isolation_app_addresses
  changed_when: false
  check_mode: false
  no_log: true

# The producer records native DHCP lease addresses, not static reservations.
# Keep stopped-static support; conflicting static ownership never uses DHCP proof.
- name: Count only DHCP reservations for the recorded guest identity
  ansible.builtin.set_fact:
    aap_isolation_app_static_counts:
      mac: '{{ __aap_app_dhcp_xml | regex_findall(__aap_app_static_mac_pattern) | length }}'
      address: '{{ __aap_app_dhcp_xml | regex_findall(__aap_app_static_ip_pattern) | length }}'
      pair: '{{ __aap_app_dhcp_xml | regex_findall(__aap_app_reservation_pattern) | length }}'
    aap_isolation_app_address_matches: >-
      {{ (__aap_app_dhcp_xml | regex_findall(__aap_app_static_mac_pattern) | length == 1) and
         (__aap_app_dhcp_xml | regex_findall(__aap_app_static_ip_pattern) | length == 1) and
         (__aap_app_dhcp_xml | regex_findall(__aap_app_reservation_pattern) | length == 1) }}
  vars:
    __aap_app_dhcp_xml: '{{ aap_isolation_app_addresses.stdout | regex_findall("(?s)<dhcp(?:\s[^>]*)?>.*?</dhcp>") | join }}'
    __aap_app_static_mac_pattern: >-
      <host(?=\s)(?=[^>]*\smac=['"]{{ aap_isolation_app_owner.guest.mac | regex_escape }}['"])[^>]*>
    __aap_app_static_ip_pattern: >-
      <host(?=\s)(?=[^>]*\sip=['"]{{ aap_isolation_app_owner.guest.address | regex_escape }}['"])[^>]*>
    __aap_app_reservation_pattern: >-
      (?x)<host(?=\s)
      (?=[^>]*\smac=['"]{{ aap_isolation_app_owner.guest.mac | regex_escape }}['"])
      (?=[^>]*\sip=['"]{{ aap_isolation_app_owner.guest.address | regex_escape }}['"])[^>]*>
  no_log: true

- name: Verify the existing native DHCP assignment without static ownership
  when:
    - aap_isolation_app_static_counts.mac | int == 0
    - aap_isolation_app_static_counts.address | int == 0
  block:
    - name: Read all leases on the exact recorded network to detect crossed ownership
      ansible.builtin.command:
        argv: [virsh, -c, 'qemu:///system', net-dhcp-leases, '{{ aap_isolation_app_owner.guest.network }}']
      environment:
        LC_ALL: C
        TZ: UTC
      register: aap_isolation_app_leases
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the native lease table before interpreting its rows
      ansible.builtin.assert:
        that:
          - aap_isolation_app_leases.stdout_lines | length >= 2
          - aap_isolation_app_leases.stdout_lines[0] is match('^\s*Expiry Time\s+MAC address\s+Protocol\s+IP address\s+')
          - aap_isolation_app_leases.stdout_lines[1] is match('^\s*-+\s*$')
        quiet: true
      no_log: true

    - name: Read the native table columns without logging lease data
      ansible.builtin.set_fact:
        aap_isolation_app_lease_rows: '{{ aap_isolation_app_leases.stdout_lines[2:] | map("trim") | reject("equalto", "") | map("split") | list }}'
      no_log: true

    - name: Require complete native lease rows before matching ownership
      ansible.builtin.assert:
        that:
          - item | length >= 7
          - item[0] is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
          - item[1] is match('^[0-9]{2}:[0-9]{2}:[0-9]{2}$')
          - item[2] is match('^(?:(?:[0-9a-f]{2}:){5}[0-9a-f]{2}|-)$')
          - item[3] in ['ipv4', 'ipv6']
        quiet: true
      loop: '{{ aap_isolation_app_lease_rows }}'
      no_log: true

    - name: Require one unique unexpired native IPv4 lease for the saved MAC and address
      ansible.builtin.set_fact:
        aap_isolation_app_address_matches: >-
          {{ (__aap_app_mac_leases | length == 1) and (__aap_app_ip_leases | length == 1) and
             (__aap_app_mac_leases[0] == __aap_app_ip_leases[0]) and
             (((__aap_app_mac_leases[0][0] ~ ' ' ~ __aap_app_mac_leases[0][1]) | to_datetime) >
              (now(utc=true, fmt='%Y-%m-%d %H:%M:%S') | to_datetime)) }}
      vars:
        __aap_app_mac_leases: >-
          {{ aap_isolation_app_lease_rows | selectattr('3', 'equalto', 'ipv4') |
             selectattr('2', 'equalto', aap_isolation_app_owner.guest.mac) | list }}
        __aap_app_ip_leases: >-
          {{ aap_isolation_app_lease_rows | selectattr('3', 'equalto', 'ipv4') |
             selectattr('4', 'match', (aap_isolation_app_owner.guest.address | regex_escape) ~ '/(?:[0-9]|[12][0-9]|3[0-2])$') | list }}
      no_log: true

# Report only these booleans; native readback and recorded identities stay hidden.
- name: Require the actual UUID, bridge and recorded guest address
  ansible.builtin.assert:
    that:
      - __aap_app_identity_checks.uuid_matches | bool
      - __aap_app_identity_checks.bridge_matches | bool
      - __aap_app_identity_checks.address_matches | bool
    fail_msg: >-
      Guest identity checks failed:
      uuid_matches={{ __aap_app_identity_checks.uuid_matches | bool }},
      bridge_matches={{ __aap_app_identity_checks.bridge_matches | bool }},
      address_matches={{ __aap_app_identity_checks.address_matches | bool }}.
    quiet: true
  vars:
    __aap_app_identity_checks:
      uuid_matches: '{{ aap_isolation_app_uuid.stdout | trim == aap_isolation_app_owner.guest.uuid }}'
      bridge_matches: >-
        {{ aap_isolation_app_network.stdout is search('(?m)^Bridge:\s+' ~
           (aap_isolation_app_owner.guest.bridge | regex_escape) ~ '\s*$') }}
      address_matches: '{{ aap_isolation_app_address_matches | bool }}'
  no_log: false

- name: Require only the exact recorded disk in current and persistent configurations
  ansible.builtin.assert:
    that:
      - __aap_app_disks | length == 1
      - __aap_app_disks[0] is match('^\s*file\s+disk\s+\S+\s+' ~ (aap_isolation_app_owner.guest.disk | regex_escape) ~ '\s*$')
    quiet: true
  vars:
    __aap_app_disks: '{{ item.stdout_lines | select("match", "^\s*\S+\s+disk\s+") | list }}'
  loop: '{{ aap_isolation_app_disks.results }}'
  no_log: true

- name: Require only the recorded MAC and network in both configurations
  ansible.builtin.assert:
    that:
      - __aap_app_interfaces | length == 1
      - >-
        __aap_app_interfaces[0] is match('^\S+\s+network\s+' ~ (aap_isolation_app_owner.guest.network | regex_escape) ~
          '\s+\S+\s+' ~ (aap_isolation_app_owner.guest.mac | regex_escape) ~ '$')
    quiet: true
  vars:
    __aap_app_interfaces: '{{ item.stdout_lines[2:] | map("trim") | reject("equalto", "") | list }}'
  loop: '{{ aap_isolation_app_interfaces.results }}'
  no_log: true

- name: Require every grant to identify only its verified recorded guest
  ansible.builtin.assert:
    that:
      - item.keys() | sort == ['bridge', 'destinations', 'ipv4', 'mac', 'ports']
      - item.bridge == aap_isolation_app_owner.guest.bridge
      - item.ipv4 == aap_isolation_app_owner.guest.address
      - item.mac == aap_isolation_app_owner.guest.mac
    quiet: true
  loop: '{{ aap_isolation_app_owner.clients }}'
  no_log: true

- name: Retain only these verified application tuples in this job's effective policy
  ansible.builtin.set_fact:
    aap_isolation_app_clients: '{{ aap_isolation_app_clients + aap_isolation_app_owner.clients }}'
  no_log: true
