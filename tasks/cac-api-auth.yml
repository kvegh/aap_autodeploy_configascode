---
- name: Require the shared instance token-store credential
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'AAP_INSTANCE_KEY_STORE_FILE') | length > 0
    fail_msg: Attach AAP API/MCP Auth Token Store to this job template.
    quiet: true

- name: Select API access by inventory instance name from the injected token store
  aap_instance_access:
    instance_name: "{{ aap_instance_key | aap_inventory_instance_name(hostvars[aap_instance_key]) }}"
    fqdn: "{{ hostvars[aap_instance_key].ansible_fqdn }}"
  register: cac_selected_instance_access
  no_log: true

- name: Explain a safe instance-token selection failure without revealing stored data
  ansible.builtin.assert:
    that: cac_selected_instance_access.access_error is not defined
    fail_msg: "{{ cac_selected_instance_access.access_error | default('The selected instance API access is unavailable.') }}"
    quiet: true

- name: Pass only the selected instance authentication to the configuration roles
  ansible.builtin.set_fact:
    cac_api_auth: "{{ cac_selected_instance_access.authentication }}"
    aap_hostname: "{{ cac_selected_instance_access.authentication.hostname }}"
    aap_token: "{{ cac_selected_instance_access.authentication.token }}"
    aap_username: ''
    aap_password: ''
    aap_request_timeout: 10.0
    aap_validate_certs: true
  no_log: true

- name: Supplement job-local API trust with the existing injected CA
  when: lookup('ansible.builtin.env', 'AAP_CAC_SOURCE_CA_FILE') | length > 0
  no_log: true
  block:
    - name: Validate the injected CA and locate the unchanged default trust bundle
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - >-
            import ssl, sys; context = ssl.create_default_context();
            context.load_verify_locations(cafile=sys.argv[1]);
            print(ssl.get_default_verify_paths().cafile or '')
          - "{{ lookup('ansible.builtin.env', 'AAP_CAC_SOURCE_CA_FILE') }}"
      register: cac_api_default_ca
      changed_when: false

    - name: Require the supported execution environment's default PEM trust
      ansible.builtin.assert:
        that: cac_api_default_ca.stdout | trim | length > 0
        fail_msg: Require the execution environment's default PEM trust bundle.

    - name: Append the declared CA to a private copy of default trust
      ansible.builtin.copy:
        dest: "{{ cac_workspace.path }}/selected-api-ca.pem"
        mode: '0600'
        content: |
          {{ lookup('ansible.builtin.file', cac_api_default_ca.stdout | trim, rstrip=false) }}
          {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'AAP_CAC_SOURCE_CA_FILE'), rstrip=false) }}
      diff: false

    - name: Bind supplemental trust only to this job's API requests
      ansible.builtin.set_fact:
        cac_api_ca_path: "{{ cac_workspace.path }}/selected-api-ca.pem"

- name: Authenticate the supplied bearer before fetching private configuration
  ansible.builtin.uri:
    url: "{{ cac_api_auth.hostname }}/api/gateway/v1/me/"
    headers:
      Authorization: "Bearer {{ cac_api_auth.token }}"
    validate_certs: true
    ca_path: "{{ cac_api_ca_path | default(omit, true) }}"
    follow_redirects: none
    status_code: 200
  register: cac_bearer_probe
  failed_when: false
  no_log: true

- name: Require authenticated HTTPS and report only a safe failure category
  ansible.builtin.assert:
    that: cac_bearer_probe.status | default(-1) | int == 200
    fail_msg: >-
      Selected AAP HTTPS authentication failed
      (HTTP {{ cac_bearer_probe.status | default(-1) | int }};
      {{ 'API authorization rejected' if cac_bearer_probe.status | default(-1) | int in [401, 403]
         else 'TLS certificate validation' if ('certificate' in cac_bearer_error_message or 'ssl' in cac_bearer_error_message)
         else 'DNS resolution' if ('name resolution' in cac_bearer_error_message or 'name or service' in cac_bearer_error_message
                                  or 'nodename' in cac_bearer_error_message or 'resolve' in cac_bearer_error_message)
         else 'connection timeout' if ('timed out' in cac_bearer_error_message or 'timeout' in cac_bearer_error_message)
         else 'network connection' if ('connection refused' in cac_bearer_error_message or 'no route' in cac_bearer_error_message
                                      or 'unreachable' in cac_bearer_error_message)
         else 'request failed' }}).
      Protected response details remain hidden.
    quiet: true
  vars:
    cac_bearer_error_message: "{{ cac_bearer_probe.msg | default('') | lower }}"
