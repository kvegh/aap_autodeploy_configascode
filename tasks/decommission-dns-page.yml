---
- name: Read a bounded page from the entire DNS zone
  ansible.builtin.uri:
    url: "https://api.godaddy.com/v1/domains/{{ vault_domain }}/records?limit=500&offset={{ aap_dns_page_offset }}"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_godaddy_api_token }}"
    status_code: 200
    validate_certs: true
    follow_redirects: none
  delegate_to: localhost
  become: false
  check_mode: false
  register: aap_dns_zone_page
  no_log: true

- name: Require a complete provider record array
  ansible.builtin.assert:
    that: aap_dns_zone_page.json | type_debug == 'list'
  no_log: true

- name: Retain the protected records and pagination state
  ansible.builtin.set_fact:
    aap_dns_zone_records: "{{ aap_dns_zone_records | default([]) + aap_dns_zone_page.json }}"
    aap_dns_zone_complete: "{{ aap_dns_zone_page.json | length < 500 }}"
  no_log: true
