---
- name: Require an explicit HTTPS target and private Git repository
  ansible.builtin.assert:
    that:
      - aap_hostname is defined
      - aap_hostname is string
      - (aap_hostname | ansible.builtin.urlsplit('scheme')) == 'https'
      - (aap_hostname | ansible.builtin.urlsplit('hostname') | default('', true) | length) > 0
      - (aap_hostname | ansible.builtin.urlsplit('username')) is none
      - (aap_hostname | ansible.builtin.urlsplit('password')) is none
      - aap_config_repo_url is defined
      - aap_config_repo_url is string
      - (aap_config_repo_url | ansible.builtin.urlsplit('scheme')) == 'https'
      - (aap_config_repo_url | ansible.builtin.urlsplit('hostname') | default('', true) | length) > 0
      - (aap_config_repo_url | ansible.builtin.urlsplit('username')) is none
      - (aap_config_repo_url | ansible.builtin.urlsplit('password')) is none
      - (aap_config_repo_url | ansible.builtin.urlsplit('path')) not in ['', '/']
      - (aap_config_repo_url | ansible.builtin.urlsplit('query')) == ''
      - (aap_config_repo_url | ansible.builtin.urlsplit('fragment')) == ''
      - aap_config_repo_url is not search('\\s')
    fail_msg: Supply a target AAP HTTPS URL and an HTTPS private Git URL without embedded credentials.

- name: Require the injected private configuration Git token
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'CAC_GIT_TOKEN') | length > 0
    fail_msg: Attach the Git credential that injects CAC_GIT_TOKEN.
  no_log: true

- name: Create a private temporary configuration workspace
  ansible.builtin.tempfile:
    state: directory
    prefix: aap-autodeploy-cac-
  register: cac_workspace

- name: Prepare the temporary Git authentication helper
  ansible.builtin.copy:
    dest: "{{ cac_workspace.path }}/git-askpass"
    mode: '0700'
    content: |
      #!/bin/sh
      case "$1" in
        *Username*) printf '%s\n' 'x-access-token' ;;
        *Password*) printf '%s\n' "$CAC_GIT_TOKEN" ;;
        *) exit 1 ;;
      esac

- name: Download the private configuration from main with protected authentication
  ansible.builtin.git:
    repo: "{{ aap_config_repo_url }}"
    dest: "{{ cac_workspace.path }}/repository"
    version: main
    depth: 1
    recursive: false
    single_branch: true
  environment:
    GIT_ASKPASS: "{{ cac_workspace.path }}/git-askpass"
    GIT_TERMINAL_PROMPT: '0'
    LC_ALL: C
    GIT_CONFIG_COUNT: '3'
    GIT_CONFIG_KEY_0: credential.helper
    GIT_CONFIG_VALUE_0: ''
    GIT_CONFIG_KEY_1: http.followRedirects
    GIT_CONFIG_VALUE_1: 'false'
    GIT_CONFIG_KEY_2: http.sslVerify
    GIT_CONFIG_VALUE_2: 'true'
  no_log: true

- name: Read only the requested configuration ciphertexts
  ansible.builtin.slurp:
    src: "{{ cac_workspace.path }}/repository/{{ item }}"
  loop:
    - cac/base_CaC_vault.yml
    - cac/autodeploy.yml
  register: cac_configuration_ciphertexts
  no_log: true

- name: Require every configuration file to be fully Vault encrypted
  ansible.builtin.assert:
    that:
      - (item.content | b64decode) is match('^\$ANSIBLE_VAULT;1\.[12];AES256(;[^\r\n]+)?\r?\n')
    fail_msg: All downloaded configuration inputs must be fully Vault encrypted.
  loop: "{{ cac_configuration_ciphertexts.results }}"
  no_log: true

- name: Load the shared authentication inputs and the separate AutoDeploy capture
  ansible.builtin.include_vars:
    file: "{{ cac_workspace.path }}/repository/{{ item }}"
  loop:
    - cac/base_CaC_vault.yml
    - cac/autodeploy.yml
  no_log: true
