---
- name: Provision replacement configuration-access credentials from encrypted base
  when: cac_bootstrap_git_credentials is defined or cac_bootstrap_vault_credentials is defined
  no_log: true
  vars:
    cac_bootstrap_organization: "{{ pah_base.organization | default('Default') }}"
    cac_bootstrap_git_type_name: Cac_git_token_type
    cac_bootstrap_git_type_inputs:
      fields:
        - id: token
          type: string
          label: Git token
          secret: true
      required:
        - token
    cac_bootstrap_git_type_injectors:
      env:
        CAC_GIT_TOKEN: "{{ '{{ token }}' }}"
    cac_bootstrap_git_names:
      base: Cac_git_token
      assistant_team: Assistant Team CaC Git Read
      windows_disconnected: Windows CaC Git Read
      orchestrator: Orchestrator CaC Git Read
  block:
    - name: Require all four Git inputs and the CaC Vault input together
      ansible.builtin.assert:
        that:
          - cac_bootstrap_git_credentials is defined
          - cac_bootstrap_git_credentials is mapping
          - cac_bootstrap_vault_credentials is defined
          - cac_bootstrap_vault_credentials is mapping
          - cac_bootstrap_git_names.keys() | difference(cac_bootstrap_git_credentials.keys()) | length == 0
          - cac_bootstrap_vault_credentials.cac is defined
          - cac_bootstrap_vault_credentials.cac is mapping
          - cac_bootstrap_vault_credentials.cac.name is string
          - cac_bootstrap_vault_credentials.cac.name | length > 0
          - cac_bootstrap_vault_credentials.cac.vault_id == 'cac'
          - cac_bootstrap_vault_credentials.cac.vault_password is string
          - cac_bootstrap_vault_credentials.cac.vault_password | length > 0
          - cac_bootstrap_vault_credentials.cac.vault_password not in ['ASK', '$encrypted$', 'CHANGEME']
        fail_msg: Supply the four Git bootstrap inputs and a complete Vault credential with identifier cac in encrypted base.

    - name: Require usable Git secrets without copying masked API values
      ansible.builtin.assert:
        that:
          - cac_bootstrap_git_credentials[item] is mapping
          - cac_bootstrap_git_credentials[item].token is string
          - cac_bootstrap_git_credentials[item].token | length > 0
          - cac_bootstrap_git_credentials[item].token not in ['ASK', '$encrypted$', 'CHANGEME']
        fail_msg: A bootstrap Git token is missing or contains a placeholder.
      loop: "{{ cac_bootstrap_git_names.keys() | list }}"

    - name: Inspect the existing Git credential type before changing it
      ansible.builtin.uri:
        url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/controller/v2/credential_types/?name={{ cac_bootstrap_git_type_name | urlencode }}"
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      register: cac_bootstrap_existing_type

    - name: Refuse ambiguous or incompatible Git injection types
      ansible.builtin.assert:
        that:
          - cac_bootstrap_existing_type.json.count | int <= 1
          - cac_bootstrap_existing_type.json.count | int == 0 or not cac_bootstrap_existing_type.json.results[0].managed
          - cac_bootstrap_existing_type.json.count | int == 0 or cac_bootstrap_existing_type.json.results[0].kind == 'cloud'
          - cac_bootstrap_existing_type.json.count | int == 0 or cac_bootstrap_existing_type.json.results[0].inputs == cac_bootstrap_git_type_inputs
          - cac_bootstrap_existing_type.json.count | int == 0 or cac_bootstrap_existing_type.json.results[0].injectors == cac_bootstrap_git_type_injectors
        fail_msg: The named Git credential type exists with different injection behavior; review it before proceeding.

    - name: Create the reusable Git token injection type
      ansible.controller.credential_type:
        name: "{{ cac_bootstrap_git_type_name }}"
        kind: cloud
        inputs: "{{ cac_bootstrap_git_type_inputs }}"
        injectors: "{{ cac_bootstrap_git_type_injectors }}"
        controller_host: "{{ aap_hostname }}"
        controller_oauthtoken: "{{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        state: present

    - name: Select the four independently named Git credential definitions
      ansible.builtin.set_fact:
        cac_bootstrap_git_definitions: []

    - name: Build the four independently named Git credential definitions
      ansible.builtin.set_fact:
        cac_bootstrap_git_definitions: >-
          {{ (cac_bootstrap_git_definitions | default([])) + [{
            'name': cac_bootstrap_git_credentials[item].aap_credential_name | default(cac_bootstrap_git_names[item]),
            'credential_type': cac_bootstrap_git_type_name,
            'inputs': {'token': cac_bootstrap_git_credentials[item].token}
          }] }}
      loop: "{{ cac_bootstrap_git_names.keys() | list }}"

    - name: Select the CaC Vault credential definition
      ansible.builtin.set_fact:
        cac_bootstrap_definitions: >-
          {{ cac_bootstrap_git_definitions + [{
            'name': cac_bootstrap_vault_credentials.cac.name,
            'credential_type': 'Vault',
            'inputs': {
              'vault_id': cac_bootstrap_vault_credentials.cac.vault_id,
              'vault_password': cac_bootstrap_vault_credentials.cac.vault_password
            }
          }] }}

    - name: Require five distinct replacement credential names
      ansible.builtin.assert:
        that:
          - cac_bootstrap_definitions | map(attribute='name') | unique | length == 5
        fail_msg: Each bootstrap Git credential and the Vault credential must have its own name.

    - name: Inspect existing bootstrap credential ownership and types
      ansible.builtin.uri:
        url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/controller/v2/credentials/?name={{ item.name | urlencode }}"
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      loop: "{{ cac_bootstrap_definitions }}"
      register: cac_bootstrap_existing_credentials

    - name: Refuse duplicate names or existing credentials with another purpose
      ansible.builtin.assert:
        that:
          - item.json.count | int <= 1
          - item.json.count | int == 0 or item.json.results[0].summary_fields.organization.name == cac_bootstrap_organization
          - item.json.count | int == 0 or item.json.results[0].summary_fields.credential_type.name == item.item.credential_type
          - item.item.credential_type != 'Vault' or item.json.count | int == 0 or item.json.results[0].inputs.vault_id | default('') == 'cac'
        fail_msg: A bootstrap credential name already has different ownership, type, or Vault identifier; review it before proceeding.
      loop: "{{ cac_bootstrap_existing_credentials.results }}"

    - name: Create replacement bootstrap credentials while preserving existing hidden secrets
      ansible.controller.credential:
        name: "{{ item.name }}"
        organization: "{{ cac_bootstrap_organization }}"
        credential_type: "{{ item.credential_type }}"
        inputs: "{{ item.inputs }}"
        update_secrets: false
        controller_host: "{{ aap_hostname }}"
        controller_oauthtoken: "{{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        state: present
      loop: "{{ cac_bootstrap_definitions }}"
