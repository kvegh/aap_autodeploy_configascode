---
- name: Preflight the consumed AAP reservation and saved installation policy
  aap_publish_instance_keys:
    operation: installation_access
    phase: plan
    route: '{{ aap_instance_route }}'
    primary: '{{ aap_installation_primary }}'
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
  register: aap_installation_access_plan
  no_log: true

- name: Configure only the preflighted installation permission using the existing native access tasks
  ansible.builtin.include_tasks: aap-hypervisor-access.yml
  vars:
    aap_management_mode: installation
