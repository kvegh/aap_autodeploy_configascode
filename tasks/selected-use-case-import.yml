---
- name: Bind the exact scoped credentials plus registered route dependencies
  ansible.builtin.set_fact:
    aap_selected_preparation_credential_ids: >-
      {{ aap_selected_saved_credentials | aap_scoped_launch_credentials(
           cac_use_case_selector.importer_credentials[aap_selected_importer.item.name],
           aap_selected_route_credentials.results | map(attribute='json.results') | flatten | list,
           aap_selected_setup_plan.organization,
           aap_instance_route.hypervisor.machine_credential_name,
           cac_use_case_selector.shared_seed_credentials | default({})) }}
  no_log: false
  when: aap_selected_importer.item.playbook == '05-prepare-use-cases.yml'

- name: Retain the shared token store alongside preparation dependencies
  ansible.builtin.set_fact:
    aap_selected_launch_credential_ids: >-
      {{ (aap_selected_preparation_credential_ids +
         (aap_selected_api_credentials | map(attribute='id') | list)) | unique | list }}
  when: aap_selected_importer.item.playbook == '05-prepare-use-cases.yml'
  no_log: false

- name: Retain saved import access and only the reviewed Orchestrator build route
  ansible.builtin.set_fact:
    aap_selected_launch_credential_ids: >-
      {{ aap_selected_saved_credentials | aap_api_launch_credentials(
           cac_use_case_selector.importer_credentials[aap_selected_importer.item.name],
           aap_selected_api_credentials, aap_selected_setup_plan.organization,
           aap_selected_target_auth.hostname,
           cac_use_case_selector.shared_seed_credentials | default({}),
           aap_selected_importer.item.project_id | default(''),
           aap_selected_route_credentials.results | map(attribute='json.results') | flatten | list,
           aap_instance_route.hypervisor.machine_credential_name) }}
  when: aap_selected_importer.item.playbook == 'deploy-cac-project.yml'
  no_log: false

- name: Clear only the current configuration step's previous observation
  ansible.builtin.set_fact:
    aap_selected_import_job: {}
    aap_selected_import_wait: {}
  no_log: false

- name: Launch once and retain the configuration job before observing completion
  block:
    - name: Run only the just-validated configuration template with its existing credentials
      ansible.controller.job_launch:
        job_template: "{{ aap_selected_importer.json.results[0].id | string }}"
        extra_vars: >-
          {{ {'aap_instance_key': aap_instance_key, 'debug_logging': 'false'} |
             combine({'aap_config_repo_url': aap_selected_importer.item.repository}
                     if aap_selected_importer.item.playbook == '05-prepare-use-cases.yml' else {}) |
             combine(aap_selected_importer_extra) }}
        credentials: "{{ aap_selected_launch_credential_ids | map('string') | list }}"
        wait: false
        controller_host: "{{ aap_selected_source_auth.hostname }}"
        controller_oauthtoken: "{{ aap_selected_source_auth.token }}"
        validate_certs: "{{ aap_validate_certs }}"
      environment: "{{ {'SSL_CERT_FILE': aap_seed_ca_path} if aap_seed_ca_path | default('') | length > 0 else {} }}"
      register: aap_selected_import_job
      # Core evaluates changed_when before failed_when: retain the original
      # failure in this internal marker, suppress raw error summaries, then
      # reject it and any native suppressed exception immediately below.
      changed_when: aap_selected_import_job is failed
      failed_when: false
      no_log: false

    - name: Require an actual configuration job identifier before waiting
      ansible.builtin.assert:
        that:
          - not aap_selected_import_job.changed
          - not (aap_selected_import_job.unreachable | default(false))
          - aap_selected_import_job.exception is not defined
          - aap_selected_import_job.failed_when_suppressed_exception is not defined
          - aap_selected_import_job.rc | default(0) == 0
          - aap_selected_import_job.id is integer
          - aap_selected_import_job.id > 0
          - aap_selected_import_job.status is string
        fail_msg: The configuration launch did not return a valid acknowledged job.
      no_log: false

    - name: Publish the acknowledged configuration job before its completion is known
      ansible.builtin.set_stats:
        data:
          aap_selected_configuration_job:
            selection: "{{ aap_selected_importer_key }}"
            job_id: "{{ aap_selected_import_job.id }}"
            status: "{{ aap_selected_import_job.status }}"
        per_host: false
        aggregate: false
      no_log: false

    - name: Wait only for the recorded configuration job without launching another
      ansible.controller.job_wait:
        job_id: "{{ aap_selected_import_job.id }}"
        job_type: jobs
        interval: 10
        timeout: 10800
        controller_host: "{{ aap_selected_source_auth.hostname }}"
        controller_oauthtoken: "{{ aap_selected_source_auth.token }}"
        validate_certs: "{{ aap_validate_certs }}"
      environment: "{{ {'SSL_CERT_FILE': aap_seed_ca_path} if aap_seed_ca_path | default('') | length > 0 else {} }}"
      register: aap_selected_import_wait
      changed_when: aap_selected_import_wait is failed
      failed_when: false
      no_log: false

    - name: Bind only a successful observation of the same configuration job
      ansible.builtin.assert:
        that:
          - not aap_selected_import_wait.changed
          - not (aap_selected_import_wait.unreachable | default(false))
          - aap_selected_import_wait.exception is not defined
          - aap_selected_import_wait.failed_when_suppressed_exception is not defined
          - aap_selected_import_wait.rc | default(0) == 0
          - aap_selected_import_wait.id is integer
          - aap_selected_import_wait.id == aap_selected_import_job.id
          - aap_selected_import_wait.status == 'successful'
        fail_msg: The configuration observer did not verify successful completion of the recorded job.
      no_log: false

    - name: Keep the launch identity and its verified final status together
      ansible.builtin.set_fact:
        aap_selected_import_job: >-
          {{ aap_selected_import_job | combine({'status': aap_selected_import_wait.status}) }}
      no_log: false
  rescue:
    - name: Encrypt the configuration launch or observation failure with the existing CaC key
      aap_cac_diagnostic:
        stage: selected_configuration_job
      register: aap_selected_import_diagnostic
      no_log: false

    - name: Preserve only the encrypted configuration failure in native job artifacts
      ansible.builtin.set_stats:
        data:
          aap_selected_configuration_job:
            selection: "{{ aap_selected_importer_key }}"
            job_id: >-
              {{ aap_selected_import_job.id if
                 ((aap_selected_import_job.id | default(none)) is integer and
                  aap_selected_import_job.id > 0) else none }}
            status: "{{ aap_selected_import_job.status | default('unknown') }}"
          aap_selected_configuration_failure_vault: "{{ aap_selected_import_diagnostic.encrypted_diagnostic }}"
        per_host: false
        aggregate: false
      no_log: false

    - name: Stop after the protected configuration launch or observation failure
      ansible.builtin.fail:
        msg: >-
          Configuration launch or observation failed. Inspect the recorded child job
          and encrypted diagnostic before retrying; the child may have continued.

- name: Read the completed job's actual credential associations
  ansible.builtin.uri:
    url: >-
      {{ aap_selected_source_auth.hostname | regex_replace('/+$', '') }}/api/controller/v2/jobs/{{ aap_selected_import_job.id }}/credentials/?page_size=200
    headers:
      Authorization: "Bearer {{ aap_selected_source_auth.token }}"
    validate_certs: true
    ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
    follow_redirects: none
  register: aap_selected_completed_credentials
  no_log: false

- name: Require the completed job to have used exactly the bounded credential set
  ansible.builtin.assert:
    that:
      - aap_selected_completed_credentials.json.next is none
      - >-
        (aap_selected_completed_credentials.json.results | map(attribute='id') | sort | list) ==
        (aap_selected_launch_credential_ids | sort | list)
  no_log: false

- name: Require actual successful configuration-job completion
  ansible.builtin.assert:
    that:
      - aap_selected_import_job.id is integer
      - aap_selected_import_job.status == 'successful'
    fail_msg: The selected configuration import did not complete successfully.
  no_log: false

- name: Retain only the completed setup key and job result
  ansible.builtin.set_fact:
    aap_selected_setup_results: >-
      {{ aap_selected_setup_results + [{'selection': aap_selected_importer_key,
          'job_id': aap_selected_import_job.id, 'status': aap_selected_import_job.status}] }}
  no_log: false
