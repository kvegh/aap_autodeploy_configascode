---
- name: Bind the exact scoped credentials plus registered route dependencies
  ansible.builtin.set_fact:
    aap_selected_preparation_credential_ids: >-
      {{ aap_selected_saved_credentials | aap_scoped_launch_credentials(
           cac_use_case_selector.importer_credentials[aap_selected_importer.item.name],
           aap_selected_route_credentials.results | map(attribute='json.results') | flatten | list,
           aap_selected_setup_plan.organization,
           aap_instance_route.hypervisor.machine_credential_name,
           cac_use_case_selector.shared_seed_credentials | default({})) }}
  no_log: true
  when: aap_selected_importer.item.playbook == '05-prepare-use-cases.yml'

- name: Forward the selected native API credential alongside preparation dependencies
  ansible.builtin.set_fact:
    aap_selected_launch_credential_ids: >-
      {{ aap_selected_preparation_credential_ids +
         (aap_selected_api_credentials | map(attribute='id') | list) }}
  when: aap_selected_importer.item.playbook == '05-prepare-use-cases.yml'
  no_log: true

- name: Keep generic import credentials limited to the saved repository pair and selected API credential
  ansible.builtin.set_fact:
    aap_selected_launch_credential_ids: >-
      {{ aap_selected_saved_credentials | aap_api_launch_credentials(
           cac_use_case_selector.importer_credentials[aap_selected_importer.item.name],
           aap_selected_api_credentials, aap_selected_setup_plan.organization,
           aap_selected_target_auth.hostname,
           cac_use_case_selector.shared_seed_credentials | default({})) }}
  when: aap_selected_importer.item.playbook == 'deploy-cac-project.yml'
  no_log: true

- name: Run only the just-validated configuration template with its existing credentials
  ansible.controller.job_launch:
    job_template: "{{ aap_selected_importer.json.results[0].id | string }}"
    extra_vars: >-
      {{ {'aap_instance_key': aap_instance_key, 'debug_logging': 'false'} |
         combine({'aap_config_repo_url': aap_selected_importer.item.repository}
                 if aap_selected_importer.item.playbook == '05-prepare-use-cases.yml' else {}) |
         combine(aap_selected_importer_extra) }}
    credentials: "{{ aap_selected_launch_credential_ids | map('string') | list }}"
    wait: true
    interval: 10
    timeout: 10800
    controller_host: "{{ aap_seed_hostname }}"
    controller_oauthtoken: "{{ cac_gateway_token.json.token }}"
    validate_certs: "{{ aap_validate_certs }}"
  environment: "{{ {'SSL_CERT_FILE': aap_seed_ca_path} if aap_seed_ca_path | default('') | length > 0 else {} }}"
  register: aap_selected_import_job
  no_log: true

- name: Read the completed job's actual credential associations
  ansible.builtin.uri:
    url: >-
      {{ aap_seed_hostname | regex_replace('/+$', '') }}/api/controller/v2/jobs/{{ aap_selected_import_job.id }}/credentials/?page_size=200
    headers:
      Authorization: "Bearer {{ cac_gateway_token.json.token }}"
    validate_certs: true
    ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
    follow_redirects: none
  register: aap_selected_completed_credentials
  no_log: true

- name: Require the completed job to have used exactly the bounded credential set
  ansible.builtin.assert:
    that:
      - aap_selected_completed_credentials.json.next is none
      - >-
        (aap_selected_completed_credentials.json.results | map(attribute='id') | sort | list) ==
        (aap_selected_launch_credential_ids | sort | list)
  no_log: true

- name: Require actual successful configuration-job completion
  ansible.builtin.assert:
    that:
      - aap_selected_import_job.id is integer
      - aap_selected_import_job.status == 'successful'
    fail_msg: The selected configuration import did not complete successfully.
  no_log: true

- name: Retain only the completed setup key and job result
  ansible.builtin.set_fact:
    aap_selected_setup_results: >-
      {{ aap_selected_setup_results + [{'selection': aap_selected_importer_key,
          'job_id': aap_selected_import_job.id, 'status': aap_selected_import_job.status}] }}
  no_log: true
