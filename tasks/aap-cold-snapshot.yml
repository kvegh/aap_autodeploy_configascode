---
- name: Read fresh registered ownership and selected checkpoint-relevant external state
  aap_read_instance:
    instance_key: '{{ aap_instance_route.vm_name }}'
    expected_route: '{{ aap_instance_route }}'
    read_snapshot_state: true
  register: aap_snapshot_registered
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
  no_log: false

- name: Require the declared snapshot operation and an explicit rollback confirmation
  ansible.builtin.assert:
    that:
      - aap_snapshot_operation | default('create') in ['create', 'restore']
      - aap_snapshot_operation | default('create') != 'restore' or aap_snapshot_restore_confirm | default(false) | bool
      - aap_snapshot_registered.instance_resources.aap.verified | bool
      - aap_snapshot_checkpoint != 'base' or aap_snapshot_registered.snapshot_api_access is mapping
      - hactar_source_public_ip is defined
    fail_msg: Choose the exact checkpoint; explicit restore discards later guest disk changes and requires confirmation.

- name: Prepare a fresh strict guest jump route for the snapshot cycle
  ansible.builtin.include_tasks:
    file: aap-instance-ssh.yml
    apply:
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local

- name: Snapshot or restore only the selected registered AAP VM
  become_user: root
  block:
    - name: Read the authenticated guest identity before shutdown
      ansible.builtin.command:
        argv: [cat, /etc/machine-id]
      delegate_to: '{{ aap_instance_route.aap_hostname | urlsplit("hostname") }}'
      become: true
      vars: &aap_snapshot_guest_connection
        ansible_connection: ssh
        ansible_host: '{{ hostvars[inventory_hostname].aap_instance_route.vm_ip }}'
        ansible_user: '{{ vault_ansible_user }}'
        ansible_password: '{{ vault_ansible_password }}'
        ansible_ssh_common_args: '{{ hostvars[inventory_hostname].aap_instance_ssh_args }}'
        ansible_host_key_checking: true
        ansible_ssh_host_key_checking: true
      register: aap_snapshot_guest_identity
      changed_when: false
      check_mode: false

    - name: Require bounded complete Controller job quiescence before shutdown
      ansible.builtin.include_tasks: aap-snapshot-controller-idle.yml
      when: aap_snapshot_registered.snapshot_api_access is mapping
      no_log: false

    - name: Initialize the selected EDA idle check
      ansible.builtin.set_fact:
        aap_snapshot_eda_next: '{{ aap_instance_route.aap_hostname }}/api/eda/v1/activations/?page_size=100'
      when: aap_snapshot_registered.snapshot_api_access is mapping

    - name: Read all bounded EDA activation pages before shutdown
      ansible.builtin.include_tasks: aap-snapshot-eda-page.yml
      loop: '{{ range(0, 20) | list }}'
      when:
        - aap_snapshot_registered.snapshot_api_access is mapping
        - aap_snapshot_eda_next | default('') | length > 0

    - name: Refuse an incomplete EDA idle readback
      ansible.builtin.assert:
        that: aap_snapshot_eda_next | length == 0
        fail_msg: The EDA activation list exceeded the bounded read; no VM power operation is permitted.
      when: aap_snapshot_registered.snapshot_api_access is mapping

    - name: Run the bounded cold snapshot operation on the pinned hypervisor
      aap_vm_snapshot:
        route: '{{ aap_instance_route }}'
        primary: '{{ aap_snapshot_registered.instance_resources.aap }}'
        policy: '{{ aap_snapshot_policy }}'
        checkpoint: '{{ aap_snapshot_checkpoint }}'
        external_state: '{{ aap_snapshot_registered.snapshot_external_state }}'
        guest_machine_id: '{{ aap_snapshot_guest_identity.stdout | trim }}'
        protected_production_ipv4: '{{ hactar_source_public_ip }}'
        operation: '{{ aap_snapshot_operation | default("create") }}'
      delegate_to: '{{ aap_instance_route.hypervisor.address }}'
      become: true
      vars:
        ansible_connection: ssh
        ansible_host: '{{ hostvars[inventory_hostname].aap_instance_route.hypervisor.address }}'
        ansible_user: '{{ hostvars[inventory_hostname].aap_instance_route.hypervisor.user }}'
        ansible_port: '{{ hostvars[inventory_hostname].aap_instance_route.hypervisor.port }}'
        ansible_password: ''
        ansible_ssh_pass: ''
        ansible_become_password: ''
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
          -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
          -o UserKnownHostsFile={{ hostvars[inventory_hostname].aap_instance_trust.path | quote }}
        ansible_host_key_checking: true
        ansible_ssh_host_key_checking: true
      register: aap_snapshot_native_result
      no_log: false

    - name: Wait for the original strict guest connection after restart
      ansible.builtin.wait_for_connection:
        timeout: '{{ aap_snapshot_policy.start_timeout }}'
      delegate_to: '{{ aap_instance_route.aap_hostname | urlsplit("hostname") }}'
      become: true
      vars: *aap_snapshot_guest_connection
      when: not ansible_check_mode

    - name: Verify the original guest machine identity after startup
      ansible.builtin.command:
        argv: [cat, /etc/machine-id]
      delegate_to: '{{ aap_instance_route.aap_hostname | urlsplit("hostname") }}'
      become: true
      vars: *aap_snapshot_guest_connection
      register: aap_snapshot_restarted_identity
      changed_when: false
      failed_when: aap_snapshot_restarted_identity.stdout | trim != aap_snapshot_guest_identity.stdout | trim
      when: not ansible_check_mode

    - name: Verify the installed public Controller API after startup
      ansible.builtin.uri:
        url: '{{ aap_instance_route.aap_hostname }}/api/controller/v2/ping/'
        validate_certs: true
        follow_redirects: none
        status_code: 200
      register: aap_snapshot_restarted_ping
      until: aap_snapshot_restarted_ping.status | default(0) == 200 and aap_snapshot_restarted_ping.json.version | default('') | length > 0
      retries: 60
      delay: 10
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
      when: aap_snapshot_checkpoint != 'infra' and not ansible_check_mode

    - name: Report only the verified native snapshot checkpoint outcome
      ansible.builtin.set_stats:
        data:
          aap_snapshot_checkpoint_result:
            checkpoint: '{{ aap_snapshot_checkpoint }}'
            name: '{{ aap_snapshot_native_result.snapshot_name }}'
            changed: '{{ aap_snapshot_native_result.changed }}'
            operation: '{{ aap_snapshot_operation | default("create") }}'
            guest_identity_verified: '{{ not ansible_check_mode }}'
        aggregate: false
  always:
    - name: Remove only this cycle's job-local SSH trust
      ansible.builtin.file:
        path: '{{ aap_instance_trust.path }}'
        state: absent
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
      when: aap_instance_trust.path | default('') is match('^/tmp/aap-instance-known-hosts-[A-Za-z0-9_]+$')
