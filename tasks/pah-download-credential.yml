---
# Included once per repository. Tokens belong to this target, never the source AAP.
- name: Reset per-credential token state
  ansible.builtin.set_fact:
    cac_pah_download_pat: {}
    cac_pah_token_saved: false
  no_log: true

- name: Manage the persistent local PAH download credential
  block:
    - name: Look up the local PAH download credential
      ansible.builtin.uri:
        url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/controller/v2/credentials/?name={{ cac_pah_credential.name | urlencode }}"
        headers:
          Authorization: "Bearer {{ aap_token }}"
        status_code: 200
        validate_certs: "{{ aap_validate_certs }}"
      register: cac_pah_existing_credential

    - name: Preserve only an unambiguous credential for the intended local repository
      ansible.builtin.assert:
        that:
          - cac_pah_existing_credential.json.count in [0, 1]
          - >-
            cac_pah_existing_credential.json.count == 0 or
            (cac_pah_existing_credential.json.results[0].summary_fields.organization.name == pah_base.organization and
             cac_pah_existing_credential.json.results[0].summary_fields.credential_type.name == 'Ansible Galaxy/Automation Hub API Token' and
             cac_pah_existing_credential.json.results[0].inputs.url == cac_pah_repository_url and
             (cac_pah_existing_credential.json.results[0].inputs.auth_url | default('', true)) == '' and
             (cac_pah_existing_credential.json.results[0].inputs.token | default('') | length) > 0)
        fail_msg: Review the existing PAH credential's organization, type, local repository URL, and stored token before changing it.

    - name: Create a read token only for a missing local PAH credential
      ansible.builtin.uri:
        url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/tokens/"
        method: POST
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        body_format: json
        body:
          description: "AAP base PAH downloads - {{ cac_pah_credential.repository }}"
          scope: read
          application: null
        status_code: 201
        validate_certs: "{{ aap_validate_certs }}"
      when: cac_pah_existing_credential.json.count == 0
      register: cac_pah_download_pat

    - name: Save the read token in the local PAH download credential
      ansible.controller.credential:
        name: "{{ cac_pah_credential.name }}"
        description: "Local PAH collection downloads - {{ cac_pah_credential.repository }}"
        organization: "{{ pah_base.organization }}"
        credential_type: Ansible Galaxy/Automation Hub API Token
        inputs:
          url: "{{ cac_pah_repository_url }}"
          token: "{{ cac_pah_download_pat.json.token }}"
        controller_host: "{{ aap_hostname }}"
        controller_oauthtoken: "{{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
      when: cac_pah_existing_credential.json.count == 0

    - name: Mark the new local PAH token as stored
      ansible.builtin.set_fact:
        cac_pah_token_saved: true
      when: cac_pah_existing_credential.json.count == 0
  always:
    - name: Check whether an interrupted credential save persisted
      ansible.builtin.uri:
        url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/controller/v2/credentials/?name={{ cac_pah_credential.name | urlencode }}"
        headers:
          Authorization: "Bearer {{ aap_token }}"
        status_code: 200
        validate_certs: "{{ aap_validate_certs }}"
      when:
        - cac_pah_download_pat.json.id is defined
        - not cac_pah_token_saved
      register: cac_pah_credential_after_failure

    - name: Revoke a new PAH token only when its credential was not saved
      ansible.builtin.uri:
        url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/tokens/{{ cac_pah_download_pat.json.id }}/"
        method: DELETE
        headers:
          Authorization: "Bearer {{ aap_token }}"
        status_code: [204, 404]
        validate_certs: "{{ aap_validate_certs }}"
      when:
        - cac_pah_download_pat.json.id is defined
        - not cac_pah_token_saved
        - cac_pah_credential_after_failure.json.count | default(-1) == 0
  no_log: true
