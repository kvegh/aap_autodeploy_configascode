---
- name: Import Assistant Team configuration after shared base
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - myvars
    - vars/main.yml
  vars:
    dispatch_include_wildcard_vars: true
    # AAP 2.7 manages applications through Gateway; Controller no longer ships this module.
    aap_configuration_dispatcher_exclude_roles:
      - controller_applications
      # Import definitions without launching their automation.
      - controller_job_launch
      - controller_workflow_launch
    debug_logging: false
    aap_configuration_secure_logging: "{{ not (debug_logging | bool) }}"
    # Credential values remain protected even during diagnostic logging.
    controller_configuration_credentials_secure_logging: true
    aap_username: admin
    aap_validate_certs: false
  pre_tasks:
    - name: Require a Boolean debug logging choice
      ansible.builtin.assert:
        that:
          - debug_logging is boolean or (debug_logging is string and (debug_logging | lower) in ['true', 'false'])
        fail_msg: Set debug_logging to true or false.

    - name: Require an explicit target AAP HTTPS URL
      ansible.builtin.assert:
        that:
          - aap_hostname is defined
          - aap_hostname is string
          - (aap_hostname | ansible.builtin.urlsplit('scheme')) == 'https'
          - (aap_hostname | ansible.builtin.urlsplit('hostname') | default('', true) | length) > 0
          - (aap_hostname | ansible.builtin.urlsplit('username')) is none
          - (aap_hostname | ansible.builtin.urlsplit('password')) is none
        fail_msg: Supply aap_hostname as the target AAP HTTPS URL, using the intended internal hostname or IP address.

    - name: Require a private SSH configuration repository URL
      ansible.builtin.assert:
        that:
          - aap_config_repo_url is defined
          - aap_config_repo_url is string
          - (aap_config_repo_url | ansible.builtin.urlsplit('scheme')) == 'ssh'
          - (aap_config_repo_url | ansible.builtin.urlsplit('hostname') | default('', true) | length) > 0
          - (aap_config_repo_url | ansible.builtin.urlsplit('username')) == 'git'
          - (aap_config_repo_url | ansible.builtin.urlsplit('password')) is none
          - (aap_config_repo_url | ansible.builtin.urlsplit('path')) not in ['', '/']
          - (aap_config_repo_url | ansible.builtin.urlsplit('query')) == ''
          - (aap_config_repo_url | ansible.builtin.urlsplit('fragment')) == ''
          - aap_config_repo_url is not search('\\s')
        fail_msg: Supply aap_config_repo_url as ssh://git@GIT_HOST/OWNER/REPOSITORY.git without a password, query, or fragment.

    - name: Inspect the injected Git authentication and host trust files
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.env', item) }}"
        follow: false
      loop:
        - CAC_GIT_SSH_KEY_FILE
        - CAC_GIT_KNOWN_HOSTS_FILE
      register: cac_git_injected_files
      no_log: true

    - name: Require the injected Git private key and trusted known hosts
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.size | default(0) | int > 0
        fail_msg: Attach the CaC Git SSH read credential with private-key and trusted-known-hosts file injection.
      loop: "{{ cac_git_injected_files.results }}"
      no_log: true

    - name: Create a private temporary configuration workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: aap-assistant-team-cac-
      register: cac_workspace

    - name: Retrieve and apply only the encrypted Assistant Team configuration
      block:
        - name: Retrieve the private configuration with protected Git diagnostics
          block:
            - name: Download the private configuration from main
              ansible.builtin.git:
                repo: "{{ aap_config_repo_url }}"
                dest: "{{ cac_workspace.path }}/repository"
                version: main
                depth: 1
                recursive: false
                single_branch: true
                key_file: "{{ lookup('ansible.builtin.env', 'CAC_GIT_SSH_KEY_FILE') }}"
                ssh_opts: >-
                  -o StrictHostKeyChecking=yes
                  -o UserKnownHostsFile={{ lookup('ansible.builtin.env', 'CAC_GIT_KNOWN_HOSTS_FILE') | quote }}
                  -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
                  -o BatchMode=yes -o IdentitiesOnly=yes
              environment:
                GIT_TERMINAL_PROMPT: '0'
                LC_ALL: C
                GIT_CONFIG_COUNT: '1'
                GIT_CONFIG_KEY_0: credential.helper
                GIT_CONFIG_VALUE_0: ''
              no_log: true
          rescue:
            - name: Classify the private Git failure without logging its contents
              ansible.builtin.set_fact:
                cac_git_failure_category: >-
                  {% if cac_git_failure_message is search('repository (.* )?not found|authentication failed|access denied|permission denied|could not read username|could not read password|invalid username|invalid credentials|returned error: (401|403|404)|terminal prompts disabled') %}
                  repository access denied or repository not found
                  {% elif cac_git_failure_message is search('could not resolve host|could not resolve proxy|name or service not known|temporary failure in name resolution') %}
                  DNS resolution failure
                  {% elif cac_git_failure_message is search('host key verification failed|remote host identification has changed|no .* host key is known') %}
                  SSH host-key verification failure
                  {% elif cac_git_failure_message is search('ssl certificate|ssl peer certificate|certificate verify failed|server certificate verification failed|ssl connection error|tls handshake|unable to get local issuer certificate') %}
                  TLS or certificate validation failure
                  {% elif cac_git_failure_message is search('redirect|redirection') %}
                  HTTP redirect rejected
                  {% elif cac_git_failure_message is search('timed out|timeout|failed to connect|could not connect|connection refused|network is unreachable|connection reset') %}
                  connection failure or timeout
                  {% else %}
                  unclassified Git failure
                  {% endif %}
              vars:
                cac_git_failure_message: "{{ ansible_failed_result.msg | default('', true) | string | lower }}"
              no_log: true

            - name: Report only the private Git failure category
              ansible.builtin.fail:
                msg: "Private configuration Git fetch failed: {{ cac_git_failure_category | trim }}."

        - name: Read the encrypted Assistant Team configuration
          ansible.builtin.slurp:
            src: "{{ cac_workspace.path }}/repository/vaults/cac/assistant_team_vault.yml"
          register: cac_encrypted_assistant_team
          no_log: true

        - name: Require a fully Vault-encrypted Assistant Team configuration
          ansible.builtin.assert:
            that:
              - (cac_encrypted_assistant_team.content | b64decode) is match('^\$ANSIBLE_VAULT;1\.[12];AES256(;[^\r\n]+)?\r?\n')
            fail_msg: The Assistant Team configuration must be a Vault-encrypted file.
          no_log: true

        - name: Decrypt and load the Assistant Team configuration with the attached Vault credentials
          ansible.builtin.include_vars:
            file: "{{ cac_workspace.path }}/repository/vaults/cac/assistant_team_vault.yml"
          no_log: true

        - name: Require complete ordinary Assistant Team definitions and secrets
          ansible.builtin.assert:
            that:
              - assistant_team_capture_readiness is mapping
              - assistant_team_capture_readiness.ordinary_aap_objects_complete is boolean
              - assistant_team_capture_readiness.ordinary_aap_objects_complete
              - assistant_team_capture_readiness.ordinary_deployment_configuration_ready is boolean
              - assistant_team_capture_readiness.ordinary_deployment_configuration_ready
              - assistant_team_capture_readiness.static_secrets_complete is boolean
              - assistant_team_capture_readiness.static_secrets_complete
              - assistant_team_capture_readiness.external_encrypted_configuration_embedded is boolean
              - assistant_team_capture_readiness.external_encrypted_configuration_embedded
              - assistant_team_capture_readiness.unresolved_secrets is sequence
              - assistant_team_capture_readiness.unresolved_secrets is not string
              - assistant_team_capture_readiness.unresolved_secrets is not mapping
              - assistant_team_capture_readiness.unresolved_secrets | length == 0
              - assistant_team_required_secrets is sequence
              - assistant_team_required_secrets is not string
              - assistant_team_required_secrets is not mapping
              - assistant_team_required_secrets | length == 0
              - controller_templates_assistant_team | length == 6
            fail_msg: Complete the six ordinary Assistant Team definitions and secrets; keep authentication maintenance outside default dispatch.
          no_log: true

        - name: Require protected ordinary deployment credentials
          ansible.builtin.assert:
            that:
              - item in vars
              - vars[item] is string
              - vars[item] | length > 0
              - vars[item] not in ['CHANGEME', '$encrypted$']
            fail_msg: Supply all ordinary Assistant Team credential inputs through encrypted configuration.
          loop:
            - assistant_team_hypervisor_ssh_username
            - assistant_team_hypervisor_ssh_private_key
            - assistant_team_guest_ssh_username
            - assistant_team_guest_ssh_password
            - assistant_team_guest_become_password
            - assistant_team_playbook_vault_password
          no_log: true

        - name: Select the ordinary encrypted file credential
          ansible.builtin.set_fact:
            cac_assistant_team_snapshot_credentials: >-
              {{ controller_credentials_assistant_team
                 | selectattr('inputs.environment_vault', 'defined') | list }}
          no_log: true

        - name: Require exactly one ordinary encrypted file credential
          ansible.builtin.assert:
            that:
              - cac_assistant_team_snapshot_credentials | length == 1
            fail_msg: Supply one complete encrypted Assistant Team file credential.
          no_log: true

        - name: Require fully encrypted deployment and authentication snapshots
          ansible.builtin.assert:
            that:
              - cac_assistant_team_snapshot_credentials[0].inputs[item] is string
              - cac_assistant_team_snapshot_credentials[0].inputs[item] is match('^\$ANSIBLE_VAULT;1\.[12];AES256(;[^\r\n]+)?\r?\n')
            fail_msg: All six embedded Assistant Team file snapshots must remain fully Vault encrypted.
          loop:
            - environment_vault
            - fresh_test_vault
            - retire_test_vault
            - claude_auth_recovery_vault
            - codex_auth_recovery_vault
            - bootstrap_auth_vault
          no_log: true

        - name: Require configuration without job launches or schedules
          ansible.builtin.assert:
            that:
              - vars[item] | length == 0
            fail_msg: This importer restores definitions only; remove job launches and schedules from this configuration.
          loop: "{{ query('ansible.builtin.varnames', '^controller_(launch_jobs|workflow_launch_jobs|schedules)(_|$)') }}"
          no_log: true

        - name: Read the current Gateway administrator password from the installer
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import json
                import shlex
                import sys
                from pathlib import Path

                for line in Path(sys.argv[1]).read_text().splitlines():
                    key, separator, value = line.partition('=')
                    if separator and key.strip() == 'gateway_admin_password':
                        parts = shlex.split(value.strip(), comments=True)
                        if parts:
                            print(json.dumps({'password': parts[0]}))
                            break
                else:
                    sys.exit('Gateway admin password is missing from the installer inventory.')
              - "{{ installer_extract_dir }}/ansible-automation-platform-containerized-setup-bundle-{{ aap_version }}-x86_64/inventory"
          delegate_to: "{{ aap_hostname | ansible.builtin.urlsplit('hostname') }}"
          vars:
            ansible_connection: ssh
            ansible_user: "{{ vault_ansible_user }}"
            ansible_password: "{{ vault_ansible_password }}"
            ansible_become: true
          when: aap_password is not defined
          changed_when: false
          register: cac_installer_admin
          no_log: true

        - name: Use the current Gateway administrator password
          ansible.builtin.set_fact:
            aap_password: "{{ (cac_installer_admin.stdout | from_json).password }}"
          when: aap_password is not defined
          no_log: true

        - name: Create a Gateway token for this configuration run
          ansible.builtin.uri:
            url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/tokens/"
            method: POST
            url_username: "{{ aap_username }}"
            url_password: "{{ aap_password }}"
            force_basic_auth: true
            body_format: json
            body:
              description: "Temporary Assistant Team CaC token {{ cac_workspace.path | basename }}"
              scope: write
              application: null
            status_code: 201
            validate_certs: "{{ aap_validate_certs }}"
          register: cac_gateway_token
          no_log: true

        - name: Use the Gateway token for configuration roles
          ansible.builtin.set_fact:
            aap_token: "{{ cac_gateway_token.json.token }}"
          no_log: true

        - name: Combine Assistant Team definitions without logging their contents
          ansible.builtin.include_role:
            name: infra.aap_configuration.dispatch
            tasks_from: include_wildcard_vars
            apply:
              no_log: true
          no_log: true

        - name: Import Assistant Team definitions without launching jobs
          ansible.builtin.include_role:
            name: infra.aap_configuration.dispatch
          vars:
            dispatch_include_wildcard_vars: false

      always:
        - name: Revoke the run token and clean the private workspace
          block:
            - name: Revoke the temporary Gateway token
              ansible.builtin.uri:
                url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/tokens/{{ cac_gateway_token.json.id }}/"
                method: DELETE
                headers:
                  Authorization: "Bearer {{ cac_gateway_token.json.token }}"
                status_code: [204, 404]
                validate_certs: "{{ aap_validate_certs }}"
              when: cac_gateway_token.json.id is defined
              no_log: true
          always:
            - name: Remove the temporary private configuration checkout
              ansible.builtin.file:
                path: "{{ cac_workspace.path }}"
                state: absent
