---
- name: Prepare declared use-case PAH content before importing project definitions
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - myvars
    - vars/main.yml
  vars:
    aap_username: admin
    aap_validate_certs: true
    debug_logging: false
  pre_tasks:
    - name: Select the exact registered target for configuration setup
      ansible.builtin.include_tasks: tasks/aap-instance-select.yml

    - name: Verify the selected public API before setup authentication
      ansible.builtin.include_tasks: tasks/aap-instance-api.yml

    - name: Route selected instance observers through its pinned hypervisor
      ansible.builtin.include_tasks: tasks/aap-instance-ssh.yml

  tasks:
    - name: Prepare this target using its encrypted deployment requirements
      block:
        - name: Retrieve the encrypted configuration inputs
          ansible.builtin.include_tasks: tasks/private-config-checkout.yml

        - name: Resolve prerequisites only for explicitly selected supported use cases
          ansible.builtin.set_fact:
            cac_workflow_pah: >-
              {{ cac_use_case_prerequisites |
                 aap_selected_use_case_prerequisites(aap_selected_use_cases) }}
          no_log: true

        - name: Authenticate to the configured target
          ansible.builtin.include_tasks: tasks/gateway-base-login.yml

        - name: Use the temporary Gateway token for prerequisite preparation
          ansible.builtin.set_fact:
            aap_token: "{{ cac_gateway_token.json.token }}"
          no_log: true

        - name: Prepare the declared collections and execution image
          ansible.builtin.include_tasks: tasks/use-case-prerequisites.yml
      always:
        - name: Revoke the temporary token and remove the private checkout
          ansible.builtin.include_tasks: tasks/private-config-cleanup.yml
