---
- name: "Configure DNS, certificate, and nginx reverse proxy"
  hosts: hypervisor
  become: true
  gather_facts: false
  vars_files:
    - myvars
    - vars/main.yml
  vars:
    aap_test_subdomain: "{{ (aap_hostname | ansible.builtin.urlsplit('hostname')) | regex_replace('\\.' + (vault_domain | regex_escape) + '$', '') }}"

  pre_tasks:
    - name: Select the registered instance before any infrastructure connection
      ansible.builtin.include_tasks: tasks/aap-instance-select.yml

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - vm_ip is defined
          - vm_name is defined
          - aap_instance_route | aap_instance_route is mapping
          - vm_name == aap_instance_route.vm_name
          - vm_ip == aap_instance_route.vm_ip
          - aap_hostname == aap_instance_route.aap_hostname
        fail_msg: "Required extra_vars: vm_ip, vm_name"

    - name: Bind infrastructure changes to the instance's own hypervisor
      ansible.builtin.set_fact:
        aap_hypervisor_pin: "{{ aap_instance_route.hypervisor }}"
      no_log: true

    - name: Verify the pinned hypervisor before DNS, proxy or certificate changes
      ansible.builtin.include_tasks: tasks/aap-hypervisor-pin.yml

    - name: Read DNS and certificate package readiness owned by the Hactar base OS
      ansible.builtin.command:
        argv: [rpm, -q, bind-utils, certbot, python3-certbot-nginx]
      register: aap_certificate_package_readiness
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require the shared baremetal DNS and certificate prerequisites
      ansible.builtin.assert:
        that: aap_certificate_package_readiness.rc == 0
        fail_msg: Hactar base OS must provide bind-utils, certbot and python3-certbot-nginx before this infrastructure stage.

    - name: Inspect the exact reserved hostname's existing certificate
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ aap_hostname | ansible.builtin.urlsplit('hostname') }}/{{ item }}"
      loop: [fullchain.pem, privkey.pem]
      register: aap_existing_instance_certificate
      no_log: true

    - name: Require an existing ACME registration rather than accepting new terms
      ansible.builtin.find:
        paths: /etc/letsencrypt/accounts
        patterns: regr.json
        recurse: true
        file_type: file
      register: aap_existing_acme_accounts
      no_log: true

    - name: Stop before certificate registration without explicit separate approval
      ansible.builtin.assert:
        that: >-
          aap_existing_acme_accounts.matched | int > 0 or
          (aap_existing_instance_certificate.results | selectattr('stat.exists') | list | length == 2)
        fail_msg: Register an approved ACME account separately before this infrastructure stage.

  tasks:
    - name: Read the exact reserved hostname's existing A record before changing DNS
      ansible.builtin.uri:
        url: "https://api.godaddy.com/v1/domains/{{ vault_domain }}/records/A/{{ aap_test_subdomain }}"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_godaddy_api_token }}"
        status_code: 200
        follow_redirects: none
        validate_certs: true
      delegate_to: localhost
      become: false
      register: aap_existing_instance_dns
      no_log: true

    - name: Refuse a hostname already bound to a different address
      ansible.builtin.assert:
        that: >-
          aap_existing_instance_dns.json | aap_safe_instance_dns(
            aap_test_subdomain, aap_instance_route.hypervisor.public_ip)
        fail_msg: The reserved hostname already has a conflicting DNS record; inspect it before continuing.
      no_log: true

    - name: Read the exact reserved hostname's IPv6 records
      ansible.builtin.uri:
        url: "https://api.godaddy.com/v1/domains/{{ vault_domain }}/records/AAAA/{{ aap_test_subdomain }}"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_godaddy_api_token }}"
        status_code: 200
        follow_redirects: none
        validate_certs: true
      delegate_to: localhost
      become: false
      register: aap_existing_instance_ipv6_dns
      no_log: true

    - name: Refuse an unpinned alternate IPv6 route
      ansible.builtin.assert:
        that: aap_existing_instance_ipv6_dns.json == []
        fail_msg: The selected IPv4-only instance hostname has an unexpected IPv6 record.
      no_log: true

    - name: Create GoDaddy DNS A record
      ansible.builtin.uri:
        url: "https://api.godaddy.com/v1/domains/{{ vault_domain }}/records/A/{{ aap_test_subdomain }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ vault_godaddy_api_token }}"
        body_format: json
        body:
          - data: "{{ aap_instance_route.hypervisor.public_ip }}"
            ttl: 600
        status_code: 200
        follow_redirects: none
        validate_certs: true
      delegate_to: localhost
      become: false
      no_log: true

    - name: Deploy temporary HTTP-only nginx config for certbot challenge
      ansible.builtin.template:
        src: templates/nginx-aap-test-http.conf.j2
        dest: "/etc/nginx/conf.d/{{ vm_name }}.conf"
        mode: "0644"

    - name: Validate the temporary HTTP config before reload
      ansible.builtin.command:
        argv: [/usr/sbin/nginx, -t]
      changed_when: false

    - name: Reload nginx for HTTP config
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Wait for DNS propagation
      # Query the same public resolver from the selected RHEL hypervisor. DNS
      # tooling belongs to its base OS; the official EE needs no Python add-on.
      ansible.builtin.command:
        argv:
          - dig
          - '@8.8.8.8'
          - "{{ aap_hostname | ansible.builtin.urlsplit('hostname') }}."
          - A
          - +short
          - +time=3
          - +tries=1
      register: dns_check
      changed_when: false
      check_mode: false
      failed_when: >-
        dns_check.rc != 0 or
        dns_check.stdout_lines | unique | list != [aap_instance_route.hypervisor.public_ip]
      until: dns_check is not failed
      retries: 30
      delay: 10

    - name: Obtain Let's Encrypt certificate
      ansible.builtin.command:
        cmd: >-
          certbot certonly --nginx
          -d {{ aap_test_subdomain }}.{{ vault_domain }}
          --non-interactive
        creates: "/etc/letsencrypt/live/{{ aap_test_subdomain }}.{{ vault_domain }}/fullchain.pem"

    - name: Deploy the TLS frontend pending authenticated installer trust
      ansible.builtin.template:
        src: templates/nginx-aap-test.conf.j2
        dest: "/etc/nginx/conf.d/{{ vm_name }}.conf"
        mode: "0644"
      vars:
        aap_upstream_ready: false
      notify: Reload nginx

  handlers:
    - name: Validate nginx before the TLS frontend reload
      ansible.builtin.command:
        argv: [/usr/sbin/nginx, -t]
      changed_when: false
      listen: Reload nginx

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
