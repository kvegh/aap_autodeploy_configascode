---
- name: Preflight the same exact guest operation before native verification
  ansible.builtin.include_tasks: plan.yml

- name: Bind the verified native firewall transaction inputs # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    aap_isolation_hypervisor: '{{ __recovery_release_pin }}'
    aap_isolation_trust_file: '{{ __recovery_release_trust }}'
    __recovery_release_runtime: {}
    __recovery_release_policy_attempted: false
  no_log: true

- name: Verify, apply and publish the same exact guest transition
  delegate_to: '{{ __recovery_release_pin.address }}'
  become: true
  vars: &recovery_release_connection
    ansible_connection: ssh
    ansible_host: "{{ hostvars[inventory_hostname].__recovery_release_pin.address }}"
    ansible_user: "{{ hostvars[inventory_hostname].__recovery_release_pin.user }}"
    ansible_port: "{{ hostvars[inventory_hostname].__recovery_release_pin.port }}"
    ansible_password: ''
    ansible_ssh_pass: ''
    ansible_become_password: ''
    ansible_ssh_common_args: >-
      -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
      -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile={{ hostvars[inventory_hostname].__recovery_release_trust | quote }}
      -o GlobalKnownHostsFile=/dev/null
    ansible_host_key_checking: true
    ansible_ssh_host_key_checking: true
  block:
    - name: Prepare the reviewed native source and acquire the temporary transaction lock
      ansible.builtin.include_tasks: '{{ role_path }}/../../tasks/aap-isolation-prepare.yml'

    - name: Allocate protected temporary resource validators
      ansible.builtin.tempfile:
        state: directory
        path: /tmp
        prefix: aap-guest-release-
      check_mode: false
      register: __recovery_release_runtime
      no_log: true

    - name: Stage only the existing native resource validators
      ansible.builtin.copy:
        src: '{{ role_path }}/../../src/{{ item }}'
        dest: '{{ __recovery_release_runtime.path }}/{{ item }}'
        owner: root
        group: root
        mode: '0600'
      loop: [aap_hypervisor_access.py, aap_guest_release.py]
      check_mode: false
      no_log: true

    - name: Verify actual VM identity and the exact CaC transition without changing the firewall
      # Existing libvirt provenance validation remains until the scoped helper cleanup.
      # Justification: ../../../README.md#native-firewall-transactions
      ansible.builtin.command:
        argv: [python3, '{{ __recovery_release_runtime.path }}/aap_guest_release.py']
        stdin: >-
          {{ {'operation': 'apply', 'guest': __recovery_release_guest,
              'hypervisor': __recovery_release_pin, 'transition': __recovery_release_plan.transition,
              'check_mode': ansible_check_mode | bool, 'mode': __recovery_release_mode} | to_json }}
      check_mode: false
      register: __recovery_release_apply
      changed_when: false
      no_log: true

    - name: Require the native policy to match only the exact complete CaC candidates
      ansible.builtin.include_tasks: '{{ role_path }}/../../tasks/aap-isolation-observe.yml'
      vars:
        aap_isolation_previous_policy: '{{ __recovery_release_plan.transition.previous_policy }}'
        aap_isolation_desired_policy: '{{ __recovery_release_plan.transition.desired_policy }}'

    - name: Retain the current CaC rollback candidate before applying anything
      ansible.builtin.set_fact:
        __recovery_release_rollback_policy: '{{ aap_isolation_rollback_policy }}'
        __recovery_release_policy_attempted: true
      no_log: true

    - name: Apply the complete desired CaC through native Hactar Ansible tasks
      ansible.builtin.include_tasks: '{{ hactar_firewall_source_root }}/playbooks/tasks/replacement-isolation-apply.yml'
      vars:
        hactar_isolation_policy: '{{ aap_isolation_effective_desired_policy }}'

    - name: Save the verified transition in existing encrypted CaC and source inventory
      aap_publish_instance_keys:
        operation: '{{ __recovery_release_operation }}'
        phase: publish
        guest: '{{ __recovery_release_guest }}'
        hypervisor: '{{ __recovery_release_pin }}'
        transition: '{{ __recovery_release_plan.transition }}'
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
      register: __recovery_release_publish
      when: not ansible_check_mode
      no_log: true

  rescue:
    - name: Restore only this invocation's unpublished native policy transition
      ansible.builtin.include_tasks: '{{ hactar_firewall_source_root }}/playbooks/tasks/replacement-isolation-apply.yml'
      vars:
        hactar_isolation_policy: '{{ __recovery_release_rollback_policy }}'
      when:
        - __recovery_release_policy_attempted | bool
        - not (__recovery_release_publish.durable_policy_published | default(false) | bool)
        - not ansible_check_mode

    - name: Stop after incomplete guest verification or publication
      ansible.builtin.fail:
        msg: >-
          Guest release did not finish. An unpublished policy change was restored;
          a durably published release is retained. Inspect protected job diagnostics.
      no_log: false

  always:
    - name: Remove only this job's protected native resource validators
      ansible.builtin.file:
        path: '{{ __recovery_release_runtime.path }}'
        state: absent
      check_mode: false
      when: __recovery_release_runtime.path | default('') is match('^/tmp/aap-guest-release-[A-Za-z0-9_]+$')
      no_log: true

    - name: Release this invocation's temporary lock and public checkout
      ansible.builtin.include_tasks: '{{ role_path }}/../../tasks/aap-isolation-finish.yml'
