---
- name: Configure new AAP instance (config-as-code)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - myvars
    - vars/main.yml
  vars:
    dispatch_include_wildcard_vars: true
    # AAP 2.7 manages applications through Gateway; Controller no longer ships this module.
    aap_configuration_dispatcher_exclude_roles:
      - controller_applications
      # Base prepares PAH repositories; use cases curate their content separately.
      - hub_collection_repository_sync
    debug_logging: false
    aap_configuration_secure_logging: "{{ not (debug_logging | bool) }}"
    # These roles may handle credential inputs even while ordinary diagnostics run.
    controller_configuration_credentials_secure_logging: true
    hub_configuration_collection_remote_secure_logging: true
    gateway_users_secure_logging: true
    aap_username: admin
    aap_validate_certs: true
  pre_tasks:
    - name: Repair only registered AAP installation access without rerunning platform setup
      tags: [never, aap_installation_access]
      block:
        - name: Require the installation-access tag to be the complete requested operation
          ansible.builtin.assert:
            that: ansible_run_tags | sort == ['aap_installation_access']
            fail_msg: Run only the aap_installation_access tag for this bounded policy repair.

        - name: Resolve the existing registered guest without allocating or changing it
          ansible.builtin.include_tasks:
            file: tasks/aap-instance-select.yml
            apply:
              tags: [aap_installation_access]

        - name: Prepare existing pinned SSH trust for the selected rebuild route
          ansible.builtin.include_tasks:
            file: tasks/aap-instance-ssh.yml
            apply:
              tags: [aap_installation_access]

        - name: Reconcile only the selected verified AAP installer and self-API connections
          ansible.builtin.include_tasks:
            file: tasks/aap-installation-access.yml
            apply:
              tags: [aap_installation_access]
              delegate_to: "{{ aap_instance_route.hypervisor.address }}"
              become: true
              vars:
                ansible_connection: ssh
                ansible_host: "{{ hostvars[inventory_hostname].aap_instance_route.hypervisor.address }}"
                ansible_user: "{{ hostvars[inventory_hostname].aap_instance_route.hypervisor.user }}"
                ansible_port: "{{ hostvars[inventory_hostname].aap_instance_route.hypervisor.port }}"
                ansible_password: ''
                ansible_ssh_pass: ''
                ansible_become_password: ''
                ansible_ssh_common_args: >-
                  -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
                  -o StrictHostKeyChecking=yes
                  -o UserKnownHostsFile={{ hostvars[inventory_hostname].aap_instance_trust.path | quote }}
                  -o GlobalKnownHostsFile=/dev/null
                ansible_host_key_checking: true
                ansible_ssh_host_key_checking: true
          vars:
            aap_installation_primary: "{{ aap_instance_resources.aap }}"

      always:
        - name: Remove only this access repair's temporary pinned trust file
          ansible.builtin.file:
            path: "{{ aap_instance_trust.path }}"
            state: absent
          when: aap_instance_trust.path | default('') is match('^/tmp/aap-instance-known-hosts-[A-Za-z0-9_]+$')
          no_log: true

    - name: Finish the bounded access repair without ordinary base configuration
      ansible.builtin.meta: end_play
      tags: [never, aap_installation_access]

    - name: Select the registered instance before any base configuration
      ansible.builtin.include_tasks: tasks/aap-instance-select.yml

    - name: Require a Boolean debug logging choice
      ansible.builtin.assert:
        that:
          - debug_logging is boolean or (debug_logging is string and (debug_logging | lower) in ['true', 'false'])
        fail_msg: Set debug_logging to true or false.

    - name: Require an explicit target AAP HTTPS URL
      ansible.builtin.assert:
        that:
          - aap_hostname is defined
          - aap_hostname is string
          - (aap_hostname | ansible.builtin.urlsplit('scheme')) == 'https'
          - (aap_hostname | ansible.builtin.urlsplit('hostname') | default('', true) | length) > 0
          - (aap_hostname | ansible.builtin.urlsplit('username')) is none
          - (aap_hostname | ansible.builtin.urlsplit('password')) is none
        fail_msg: Select the registered instance whose public HTTPS hostname is the intended target.

    - name: Require a private configuration repository URL without embedded credentials
      ansible.builtin.assert:
        that:
          - aap_config_repo_url is defined
          - aap_config_repo_url is string
          - (aap_config_repo_url | ansible.builtin.urlsplit('scheme')) == 'https'
          - (aap_config_repo_url | ansible.builtin.urlsplit('hostname') | default('', true) | length) > 0
          - (aap_config_repo_url | ansible.builtin.urlsplit('username')) is none
          - (aap_config_repo_url | ansible.builtin.urlsplit('password')) is none
          - (aap_config_repo_url | ansible.builtin.urlsplit('path')) not in ['', '/']
          - (aap_config_repo_url | ansible.builtin.urlsplit('query')) == ''
          - (aap_config_repo_url | ansible.builtin.urlsplit('fragment')) == ''
          - aap_config_repo_url is not search('\\s')
        fail_msg: Supply aap_config_repo_url as an HTTPS Git URL without credentials, query, or fragment.

    - name: Require the injected CaC Git token
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'CAC_GIT_TOKEN') | length > 0
        fail_msg: Attach the CaC Git credential that injects CAC_GIT_TOKEN.
      no_log: true

    - name: Create a private temporary configuration workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: aap-cac-
      register: cac_workspace

    - name: Retrieve and load the encrypted shared configuration
      block:
        - name: Prepare Git authentication without putting the token in a URL or argument
          ansible.builtin.copy:
            dest: "{{ cac_workspace.path }}/git-askpass"
            mode: '0700'
            content: |
              #!/bin/sh
              case "$1" in
                *Username*) printf '%s\n' 'x-access-token' ;;
                *Password*) printf '%s\n' "$CAC_GIT_TOKEN" ;;
                *) exit 1 ;;
              esac

        - name: Download the private configuration from main
          ansible.builtin.git:
            repo: "{{ aap_config_repo_url }}"
            dest: "{{ cac_workspace.path }}/repository"
            version: main
            depth: 1
            recursive: false
            single_branch: true
          environment:
            GIT_ASKPASS: "{{ cac_workspace.path }}/git-askpass"
            GIT_TERMINAL_PROMPT: '0'
            LC_ALL: C
            GIT_CONFIG_COUNT: '3'
            GIT_CONFIG_KEY_0: credential.helper
            GIT_CONFIG_VALUE_0: ''
            GIT_CONFIG_KEY_1: http.followRedirects
            GIT_CONFIG_VALUE_1: 'false'
            GIT_CONFIG_KEY_2: http.sslVerify
            GIT_CONFIG_VALUE_2: 'true'
          no_log: true

        - name: Read the encrypted shared configuration
          ansible.builtin.slurp:
            src: "{{ cac_workspace.path }}/repository/cac/base_CaC_vault.yml"
          register: cac_encrypted_base
          no_log: true

        - name: Require a fully Vault-encrypted shared configuration
          ansible.builtin.assert:
            that:
              - (cac_encrypted_base.content | b64decode) is match('^\$ANSIBLE_VAULT;1\.[12];AES256(;[^\r\n]+)?\r?\n')
            fail_msg: The shared configuration must be a Vault-encrypted file.
          no_log: true

        - name: Decrypt and load the shared configuration with the attached Vault credentials
          ansible.builtin.include_vars:
            file: "{{ cac_workspace.path }}/repository/cac/base_CaC_vault.yml"
          no_log: true

        - name: Validate the named default runtime before changing the target
          ansible.builtin.assert:
            that:
              - aap_default_execution_environment is string
              - aap_default_execution_environment | trim | length > 0
              - >-
                controller_execution_environments_base | selectattr('name', 'equalto',
                  aap_default_execution_environment) | list | length == 1
              - >-
                (controller_execution_environments_base | selectattr('name', 'equalto',
                  aap_default_execution_environment) | first).image is string
              - >-
                (controller_execution_environments_base | selectattr('name', 'equalto',
                  aap_default_execution_environment) | first).image | length > 0
            fail_msg: Define one base execution environment matching the configured default name.
          no_log: true

        - name: Validate the base PAH setup before changing the target
          ansible.builtin.include_tasks: tasks/pah-base-validate.yml

        - name: Validate public API DNS and TLS for the actual created instance
          ansible.builtin.include_tasks: tasks/aap-instance-api.yml

        - name: Route installer and MCP observers through the pinned hypervisor
          ansible.builtin.include_tasks: tasks/aap-instance-ssh.yml

        - name: Read the encrypted AAP subscription manifest
          ansible.builtin.slurp:
            src: "{{ cac_workspace.path }}/repository/cac/manifest.zip.vault"
          register: cac_encrypted_manifest
          no_log: true

        - name: Require a fully Vault-encrypted subscription manifest
          ansible.builtin.assert:
            that:
              - (cac_encrypted_manifest.content | b64decode) is match('^\$ANSIBLE_VAULT;1\.[12];AES256(;[^\r\n]+)?\r?\n')
            fail_msg: The subscription manifest must be a Vault-encrypted file.
          no_log: true

        - name: Decrypt the subscription manifest into the private temporary workspace
          ansible.builtin.copy:
            src: "{{ cac_workspace.path }}/repository/cac/manifest.zip.vault"
            dest: "{{ cac_workspace.path }}/manifest.zip"
            decrypt: true
            mode: '0600'
          diff: false
          no_log: true

        - name: Authenticate with the configured password or bootstrap from the installer
          ansible.builtin.include_tasks: tasks/gateway-base-login.yml

        - name: Use the Gateway token for configuration roles
          ansible.builtin.set_fact:
            aap_token: "{{ cac_gateway_token.json.token }}"
            hub_token: "{{ cac_gateway_token.json.token }}"
          no_log: true

        - name: Apply the AAP subscription before pushing configuration
          ansible.controller.license:
            manifest: "{{ cac_workspace.path }}/manifest.zip"
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ aap_token }}"
            validate_certs: "{{ aap_validate_certs }}"
            force: false
          no_log: true

        - name: Persist upload timeouts only on the native Hub registry route
          no_log: true
          block:
            - name: Validate the scoped registry timeout choice
              ansible.builtin.assert:
                that:
                  - aap_registry_route_timeout is integer
                  - aap_registry_route_timeout > 0
                fail_msg: Supply a positive integer timeout for the Hub registry route.

            - name: Read the target Gateway routes with the authenticated run token
              ansible.builtin.uri:
                url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/routes/?page_size=200"
                headers:
                  Authorization: "Bearer {{ aap_token }}"
                validate_certs: "{{ aap_validate_certs }}"
                follow_redirects: none
                status_code: 200
              register: cac_registry_routes

            - name: Require one complete target-local registry route
              ansible.builtin.assert:
                that:
                  - cac_registry_routes.json.next is none
                  - cac_registry_routes.json.results | selectattr('gateway_path', 'equalto', '/v2/') | list | length == 1
                fail_msg: The target must expose one unambiguous native Hub registry route.

            - name: Select the registry identity from this target rather than a source ID
              ansible.builtin.set_fact:
                cac_registry_route: "{{ cac_registry_routes.json.results | selectattr('gateway_path', 'equalto', '/v2/') | first }}"

            - name: Require a target-local numeric route identifier before the detail read
              ansible.builtin.assert:
                that:
                  - cac_registry_route.id is integer
                  - cac_registry_route.id > 0
                fail_msg: The selected registry route must have a target-local numeric identifier.

            - name: Read the complete registry route before comparing timeout values
              # List responses can omit or null the per-route timeouts.
              ansible.builtin.uri:
                url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/routes/{{ cac_registry_route.id }}/"
                headers:
                  Authorization: "Bearer {{ aap_token }}"
                validate_certs: "{{ aap_validate_certs }}"
                follow_redirects: none
                status_code: 200
              register: cac_registry_route_detail

            - name: Require the detail response to identify the selected target route
              ansible.builtin.assert:
                that:
                  - cac_registry_route_detail.json.id is integer
                  - cac_registry_route_detail.json.id == cac_registry_route.id
                fail_msg: The registry route detail did not match its target-local identity.

            - name: Keep the complete target route for policy validation and idempotent comparison
              ansible.builtin.set_fact:
                cac_registry_route: "{{ cac_registry_route_detail.json }}"

            - name: Require the native registry path and existing authenticated HTTPS policy
              ansible.builtin.assert:
                that:
                  - cac_registry_route.id is integer
                  - cac_registry_route.id > 0
                  - cac_registry_route.service_cluster is integer
                  - cac_registry_route.service_cluster > 0
                  - cac_registry_route.gateway_path == '/v2/'
                  - cac_registry_route.service_path == '/v2/'
                  - cac_registry_route.enable_gateway_auth is sameas true
                  - cac_registry_route.enable_mtls is sameas false
                  - cac_registry_route.is_service_https is sameas true
                  - cac_registry_route.is_internal_route is sameas false
                fail_msg: The registry route differs from the native Hub path or security policy.

            - name: Read this registry route's service cluster
              ansible.builtin.uri:
                url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/service_clusters/{{ cac_registry_route.service_cluster }}/"
                headers:
                  Authorization: "Bearer {{ aap_token }}"
                validate_certs: "{{ aap_validate_certs }}"
                follow_redirects: none
                status_code: 200
              register: cac_registry_cluster

            - name: Require the target's native Hub cluster identity
              ansible.builtin.assert:
                that:
                  - cac_registry_cluster.json.id == cac_registry_route.service_cluster
                  - cac_registry_cluster.json.name == 'hub'
                  - cac_registry_cluster.json.service_type is integer
                  - cac_registry_cluster.json.service_type > 0
                fail_msg: The registry route must belong to this target's native Hub service cluster.

            - name: Read the registry cluster's service type
              ansible.builtin.uri:
                url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/service_types/{{ cac_registry_cluster.json.service_type }}/"
                headers:
                  Authorization: "Bearer {{ aap_token }}"
                validate_certs: "{{ aap_validate_certs }}"
                follow_redirects: none
                status_code: 200
              register: cac_registry_service_type

            - name: Require the native Hub service type before changing any route
              ansible.builtin.assert:
                that:
                  - cac_registry_service_type.json.id == cac_registry_cluster.json.service_type
                  - cac_registry_service_type.json.name == 'hub'
                fail_msg: The selected registry cluster must use the target's Hub service type.

            - name: Set only the native registry route request and idle timeouts
              # This module defaults is_service_https to false. Preserve the verified
              # route flags explicitly while changing only its two timeout fields.
              ansible.platform.route:
                name: "{{ cac_registry_route.id | string }}"
                state: present
                is_service_https: "{{ cac_registry_route.is_service_https }}"
                enable_gateway_auth: "{{ cac_registry_route.enable_gateway_auth }}"
                enable_mtls: "{{ cac_registry_route.enable_mtls }}"
                request_timeout_seconds: "{{ aap_registry_route_timeout }}"
                idle_timeout_seconds: "{{ aap_registry_route_timeout }}"
                aap_hostname: "{{ aap_hostname }}"
                aap_token: "{{ aap_token }}"
                aap_validate_certs: "{{ aap_validate_certs }}"
              when: >-
                cac_registry_route.request_timeout_seconds != aap_registry_route_timeout or
                cac_registry_route.idle_timeout_seconds != aap_registry_route_timeout

            - name: Read back the same target-local registry route
              ansible.builtin.uri:
                url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/routes/{{ cac_registry_route.id }}/"
                headers:
                  Authorization: "Bearer {{ aap_token }}"
                validate_certs: "{{ aap_validate_certs }}"
                follow_redirects: none
                status_code: 200
              register: cac_registry_route_readback

            - name: Verify the registry timeout and preserve its routing and security identity
              ansible.builtin.assert:
                that:
                  - cac_registry_route_readback.json.request_timeout_seconds == aap_registry_route_timeout
                  - cac_registry_route_readback.json.idle_timeout_seconds == aap_registry_route_timeout
                  - >-
                    (cac_registry_route_readback.json | dict2items | selectattr('key', 'in', registry_identity_fields) | sort(attribute='key')) ==
                    (cac_registry_route | dict2items | selectattr('key', 'in', registry_identity_fields) | sort(attribute='key'))
                fail_msg: The Hub registry timeouts or preserved route identity did not verify.
              vars:
                registry_identity_fields:
                  - id
                  - name
                  - description
                  - gateway_path
                  - service_path
                  - http_port
                  - service_cluster
                  - service_port
                  - is_service_https
                  - is_internal_route
                  - enable_gateway_auth
                  - enable_mtls
                  - reject_failed_basic_auth
                  - node_tags

        - name: Build the reviewed default in the receiving AAP before creating its EE definitions
          ansible.builtin.include_tasks: tasks/base-execution-environment.yml

        - name: Keep configuration role async results inside this job's private workspace
          ansible.builtin.set_fact:
            aap_configuration_async_dir: "{{ cac_workspace.path }}/async"

        - name: Prepare the same private result directory for configuration launch and polling
          ansible.builtin.file:
            path: "{{ aap_configuration_async_dir }}"
            state: directory
            mode: '0700'

        - name: Create base organizations before their PAH credentials
          block:
            - name: Apply initial base organizations through the existing configuration role
              ansible.builtin.include_role:
                name: infra.aap_configuration.gateway_organizations
              vars:
                aap_organizations: "{{ aap_organizations_base }}"
                assign_galaxy_credentials_to_org: false
          rescue:
            - name: Encrypt the original organization and async cleanup failure without exposing credentials
              aap_cac_diagnostic:
              register: cac_base_organization_diagnostic
              no_log: true

            - name: Preserve only encrypted organization diagnostics in the native job artifact
              ansible.builtin.set_stats:
                data:
                  aap_base_organization_failure_vault: "{{ cac_base_organization_diagnostic.encrypted_diagnostic }}"
                per_host: false
                aggregate: false
              no_log: true

            - name: Stop base configuration after its protected organization failure
              ansible.builtin.fail:
                msg: Base organization configuration failed; inspect the encrypted diagnostic in this job's artifacts before retrying.

        - name: Prepare persistent local PAH download credentials
          ansible.builtin.include_tasks:
            file: tasks/pah-download-credential.yml
            apply:
              no_log: true
          loop: "{{ pah_base.download_credentials }}"
          loop_control:
            loop_var: cac_pah_credential
            label: "{{ cac_pah_credential.repository }}"
          vars:
            cac_pah_repository_url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/galaxy/content/{{ cac_pah_credential.repository }}/"

        - name: Combine shared configuration without logging credential inputs
          ansible.builtin.include_role:
            name: infra.aap_configuration.dispatch
            tasks_from: include_wildcard_vars
            apply:
              no_log: true

        - name: Apply shared AAP configuration
          ansible.builtin.include_role:
            name: infra.aap_configuration.dispatch
          vars:
            dispatch_include_wildcard_vars: false

        # EE database IDs differ after reinstall. Resolve the CaC-owned name on
        # this controller rather than copying an ID from the source controller.
        - name: Resolve the configured default job execution environment
          ansible.controller.execution_environment:
            name: "{{ aap_default_execution_environment }}"
            state: exists
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ aap_token }}"
            validate_certs: "{{ aap_validate_certs }}"
          register: cac_default_execution_environment
          no_log: true

        - name: Set the rebuilt controller default for job execution
          ansible.controller.settings:
            settings:
              DEFAULT_EXECUTION_ENVIRONMENT: "{{ cac_default_execution_environment.id }}"
            controller_host: "{{ aap_hostname }}"
            controller_oauthtoken: "{{ aap_token }}"
            validate_certs: "{{ aap_validate_certs }}"
          no_log: true

        - name: Configure the PAH collection selection and snapshot retention policy
          ansible.builtin.include_tasks: tasks/pah-retention-policy.yml

        - name: Verify the configured administrator password after applying base
          ansible.builtin.uri:
            url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/me/"
            url_username: "{{ aap_username }}"
            url_password: "{{ aap_password }}"
            force_basic_auth: true
            status_code: 200
            validate_certs: "{{ aap_validate_certs }}"
          when: aap_password is defined
          no_log: true

        - name: Provision replacement Git and Vault bootstrap credentials
          ansible.builtin.include_tasks: tasks/bootstrap-credentials.yml

        - name: Keep the deployed installer password current after bootstrap
          ansible.builtin.lineinfile:
            path: "{{ installer_extract_dir }}/ansible-automation-platform-containerized-setup-bundle-{{ aap_version }}-x86_64/inventory"
            regexp: '^\s*gateway_admin_password\s*='
            mode: '0600'
            line: "gateway_admin_password={{ aap_password | quote }}"
          delegate_to: "{{ aap_hostname | ansible.builtin.urlsplit('hostname') }}"
          vars:
            ansible_connection: ssh
            ansible_user: "{{ vault_ansible_user }}"
            ansible_password: "{{ vault_ansible_password }}"
            ansible_become: true
          when:
            - aap_password is defined
            - cac_installer_admin.stdout is defined
          diff: false
          no_log: true

        - name: Prepare persistent administrator MCP access
          ansible.builtin.include_tasks: tasks/mcp-access.yml
      always:
        - name: Revoke the run token and clean the private workspace
          block:
            - name: Revoke the temporary Gateway token
              ansible.builtin.uri:
                url: "{{ aap_hostname | regex_replace('/+$', '') }}/api/gateway/v1/tokens/{{ cac_gateway_token.json.id }}/"
                method: DELETE
                headers:
                  Authorization: "Bearer {{ cac_gateway_token.json.token }}"
                status_code: [204, 404]
                validate_certs: "{{ aap_validate_certs }}"
              when: cac_gateway_token.json.id is defined
              no_log: true
          always:
            - name: Finish private workspace cleanup and always discard its old SSH trust
              block:
                - name: Remove the temporary checkout, decrypted manifest, and authentication helper
                  ansible.builtin.file:
                    path: "{{ cac_workspace.path }}"
                    state: absent
              always:
                - name: Remove only the base configuration's temporary instance trust file
                  ansible.builtin.file:
                    path: "{{ aap_instance_trust.path }}"
                    state: absent
                  when: aap_instance_trust.path | default('') is match('^/tmp/aap-instance-known-hosts-[A-Za-z0-9_]+$')
                  no_log: true

  post_tasks:
    - name: Release only the successfully configured and published AAP guest
      when: not ansible_check_mode
      block:
        - name: Verify fresh guest identity and publish final AAP isolation release
          ansible.builtin.include_tasks: tasks/aap-final-release.yml
      always:
        - name: Remove only the final release's newly allocated SSH trust file
          ansible.builtin.file:
            path: "{{ aap_instance_trust.path }}"
            state: absent
          when: aap_instance_trust.path | default('') is match('^/tmp/aap-instance-known-hosts-[A-Za-z0-9_]+$')
          no_log: true
