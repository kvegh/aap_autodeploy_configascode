---
# Configure only deliberately selected umbrella use cases on the selected AAP.
# Existing seed importer templates retain their own scoped Git/Vault credentials.
# This launches configuration imports, never application/deployment/demo jobs.
- name: Install selected project definitions and saved CaC on a selected AAP
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - myvars
    - vars/main.yml
    - vars/use-case-catalog.yml
  vars:
    aap_username: admin
    aap_validate_certs: true
    debug_logging: false
    aap_seed_ca_path: "{{ lookup('ansible.builtin.env', 'AAP_CAC_SOURCE_CA_FILE') }}"
  tasks:
    - name: Configure only the selected use cases through owned seed importers
      block:
        - name: Require the destination host in the shared inventory
          ansible.builtin.assert:
            that:
              - aap_instance_key is defined
              - aap_instance_key in hostvars
              - awx_job_id is defined
            fail_msg: Run this launcher in AAP with the shared inventory and an explicit destination host.
          no_log: true

        - name: Require the existing source API credential and running job identity
          ansible.builtin.assert:
            that:
              - lookup('ansible.builtin.env', 'AAP_CAC_SOURCE_URL') | aap_https_origin | length == 2
              - lookup('ansible.builtin.env', 'AAP_CAC_SOURCE_TOKEN') | length > 0
              - awx_job_template_id is defined
              - awx_project_revision is defined
            fail_msg: Attach the source AAP API credential and run this template in AAP.
          no_log: true

        - name: Bind orchestration to the API credential of the AAP running this job
          ansible.builtin.set_fact:
            aap_selected_source_auth:
              hostname: "{{ lookup('ansible.builtin.env', 'AAP_CAC_SOURCE_URL') }}"
              token: "{{ lookup('ansible.builtin.env', 'AAP_CAC_SOURCE_TOKEN') }}"
          no_log: true

        - name: Supplement the execution environment's trust with the existing source CA
          when: aap_seed_ca_path | default('') | length > 0
          no_log: true
          block:
            - name: Create the private workspace before using supplemental source trust
              ansible.builtin.tempfile:
                state: directory
                prefix: aap-autodeploy-cac-
              register: cac_workspace

            - name: Read the execution environment's active default trust bundle path
              ansible.builtin.command:
                argv:
                  - "{{ ansible_playbook_python }}"
                  - -c
                  - >-
                    import ssl, sys; context = ssl.create_default_context();
                    context.load_verify_locations(cafile=sys.argv[1]);
                    print(ssl.get_default_verify_paths().cafile or '')
                  - "{{ aap_seed_ca_path }}"
              register: aap_source_default_ca
              changed_when: false

            - name: Require the supported execution environment's default PEM trust bundle
              ansible.builtin.assert:
                that: aap_source_default_ca.stdout | trim | length > 0
                fail_msg: Source API access requires the execution environment's default PEM trust bundle.

            - name: Preserve default trust and append only the declared supplemental CA
              ansible.builtin.copy:
                dest: "{{ cac_workspace.path }}/source-api-ca.pem"
                mode: '0600'
                content: |
                  {{ lookup('ansible.builtin.file', aap_source_default_ca.stdout | trim, rstrip=false) }}
                  {{ lookup('ansible.builtin.file', aap_seed_ca_path, rstrip=false) }}
              diff: false

            - name: Use the private combined trust only for source API operations
              ansible.builtin.set_fact:
                aap_seed_ca_path: "{{ cac_workspace.path }}/source-api-ca.pem"

        - name: Read this running job through its source API credential
          ansible.builtin.uri:
            url: >-
              {{ aap_selected_source_auth.hostname | regex_replace('/+$', '') }}/api/controller/v2/jobs/{{ awx_job_id }}/
            headers:
              Authorization: "Bearer {{ aap_selected_source_auth.token }}"
            validate_certs: true
            ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
            follow_redirects: none
          register: aap_selected_source_job
          no_log: true

        - name: Require the credential to identify the actual running source job
          ansible.builtin.assert:
            that:
              - aap_selected_source_job.json.status == 'running'
              - aap_selected_source_job.json.id | int == awx_job_id | int
              - aap_selected_source_job.json.job_template | int == awx_job_template_id | int
              - aap_selected_source_job.json.scm_revision == awx_project_revision
            fail_msg: The source API credential must identify the AAP running this job.
          no_log: true

        - name: Select destination API authentication from the existing instance token store
          ansible.builtin.include_tasks: tasks/cac-api-auth.yml

        - name: Retain only the selected destination API authentication
          ansible.builtin.set_fact:
            aap_selected_target_auth: "{{ cac_api_auth }}"
          no_log: true

        - name: Resolve the explicit instance key before any setup orchestration
          ansible.builtin.include_tasks: tasks/aap-instance-select.yml

        - name: Keep catalog authentication on the encrypted AutoDeploy repository
          ansible.builtin.assert:
            that: >-
              (aap_use_case_catalog_repo_url | aap_normalized_git_url) ==
              (aap_registered_target.registry_repository | aap_normalized_git_url)
            fail_msg: Use the AutoDeploy repository selected by encrypted configuration.
          no_log: true

        - name: Require inventory and registered preparation routes to identify the same API
          ansible.builtin.assert:
            that:
              - (aap_target_hostname | aap_https_origin) == (aap_selected_target_auth.hostname | aap_https_origin)
            fail_msg: The selected inventory destination and registered preparation route must agree.
          no_log: true

        - name: Verify the registered target public API before sending credentials
          ansible.builtin.include_tasks: tasks/aap-instance-api.yml

        - name: Retrieve the reviewed encrypted selector and authentication inputs
          ansible.builtin.include_tasks: tasks/private-config-checkout.yml
          vars:
            aap_hostname: "{{ aap_selected_source_auth.hostname }}"
            aap_config_repo_url: "{{ aap_use_case_catalog_repo_url }}"

        - name: Resolve only explicit supported umbrella selections
          ansible.builtin.set_fact:
            aap_selected_setup_plan: >-
              {{ aap_selected_use_cases | aap_use_case_setup_plan(
                   aap_use_case_catalog, cac_use_case_selector,
                   aap_selected_source_auth.hostname, aap_target_hostname) }}
            aap_selected_setup_results: []
          no_log: true

        - name: Read the credentials actually attached to this launcher job
          ansible.builtin.uri:
            url: >-
              {{ aap_selected_source_auth.hostname | regex_replace('/+$', '') }}/api/controller/v2/jobs/{{ awx_job_id }}/credentials/?page_size=200
            headers:
              Authorization: "Bearer {{ aap_selected_source_auth.token }}"
            validate_certs: true
            ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
            follow_redirects: none
          register: aap_selected_parent_credentials
          no_log: true

        - name: Select the shared instance token store attached to this job
          ansible.builtin.set_fact:
            aap_selected_api_credentials: "{{ aap_selected_parent_credentials.json.results | aap_instance_store_credentials }}"
          no_log: true

        - name: Read the selected store credential type
          ansible.builtin.uri:
            url: >-
              {{ aap_selected_source_auth.hostname | regex_replace('/+$', '') }}/api/controller/v2/credential_types/{{
              aap_selected_api_credentials[0].credential_type }}/
            headers:
              Authorization: "Bearer {{ aap_selected_source_auth.token }}"
            validate_certs: true
            ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
            follow_redirects: none
          register: aap_selected_api_type
          no_log: true

        - name: Require the complete association list and approved instance token store
          ansible.builtin.assert:
            that:
              - aap_selected_parent_credentials.json.next is none
              - not aap_selected_api_type.json.managed
              - aap_selected_api_type.json.name == 'Pseudo Instance Key Store'
              - aap_selected_api_type.json.id == aap_selected_api_credentials[0].credential_type
          no_log: true

        - name: Read the seed controller's current instance identities
          ansible.builtin.uri:
            url: "{{ aap_selected_source_auth.hostname | regex_replace('/+$', '') }}/api/controller/v2/instances/?page_size=200"
            headers:
              Authorization: "Bearer {{ aap_selected_source_auth.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
            follow_redirects: none
          register: aap_seed_instances
          no_log: true

        - name: Read the fresh target's identities before allowing any importer launch
          ansible.builtin.uri:
            url: "{{ aap_target_hostname | regex_replace('/+$', '') }}/api/controller/v2/instances/?page_size=200"
            headers: "{{ {'Authorization': 'Bearer ' ~ aap_selected_target_auth.token} if aap_selected_target_auth.token else {} }}"
            url_username: "{{ aap_selected_target_auth.username | default(omit, true) }}"
            url_password: "{{ aap_selected_target_auth.password | default(omit, true) }}"
            force_basic_auth: "{{ not aap_selected_target_auth.token }}"
            validate_certs: true
            follow_redirects: none
          register: aap_target_instances
          no_log: true

        - name: Verify the selected local or remote controller identities
          ansible.builtin.assert:
            that:
              - aap_seed_instances.json.next is none
              - aap_target_instances.json.next is none
              - >-
                aap_seed_instances.json.results | aap_verified_controllers(
                  aap_target_instances.json.results, aap_selected_source_auth.hostname, aap_target_hostname)
            fail_msg: The selected source and destination controller identities must match their verified API origins.
          no_log: true

        - name: Resolve only the fixed preparation and selected importer templates
          ansible.builtin.uri:
            url: >-
              {{ aap_selected_source_auth.hostname | regex_replace('/+$', '') }}/api/controller/v2/job_templates/?name={{ item.name | urlencode }}&page_size=200
            headers:
              Authorization: "Bearer {{ aap_selected_source_auth.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
            follow_redirects: none
          loop: "{{ [aap_selected_setup_plan.preparation] + aap_selected_setup_plan.importers }}"
          register: aap_selected_importer_lookups
          no_log: true

        - name: Require unique owned importer identities and fixed template behavior
          ansible.builtin.assert:
            that:
              - item.json.count == 1
              - item.json.results[0].name == item.item.name
              - item.json.results[0].playbook == item.item.playbook
              - item.json.results[0].summary_fields.organization.name == aap_selected_setup_plan.organization
              - "'aap-autodeploy' in (item.json.results[0].summary_fields.labels.results | map(attribute='name') | list)"
              - not item.json.results[0].ask_variables_on_launch
              - item.json.results[0].ask_credential_on_launch
              - item.json.results[0].survey_enabled
              - item.json.results[0].inventory is not none
              - item.json.results[0].project == aap_selected_importer_lookups.results[0].json.results[0].project
              - item.json.results[0].summary_fields.credentials | length >= 3
              - >-
                item.item.playbook != 'deploy-cac-project.yml' or
                (item.json.results[0].extra_vars | from_yaml).aap_cac_project_id == item.item.project_id
            fail_msg: Reconcile the seed's labelled configuration importers before selected setup.
          loop: "{{ aap_selected_importer_lookups.results }}"
          no_log: true

        - name: Read the importers' actual source project
          ansible.builtin.uri:
            url: >-
              {{ aap_selected_source_auth.hostname | regex_replace('/+$', '') }}/api/controller/v2/projects/{{
              aap_selected_importer_lookups.results[0].json.results[0].project }}/
            headers:
              Authorization: "Bearer {{ aap_selected_source_auth.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
            follow_redirects: none
          register: aap_selected_source_project
          no_log: true

        - name: Require the reviewed AutoDeploy source repository
          ansible.builtin.assert:
            that:
              - aap_selected_source_project.json.scm_url | aap_normalized_git_url == aap_selected_setup_plan.source_project_url
              - not aap_selected_source_project.json.allow_override
            fail_msg: Selected setup may launch only the reviewed AutoDeploy configuration importers.
          no_log: true

        - name: Check the bounded surveys before sending target variables
          ansible.builtin.uri:
            url: >-
              {{ aap_selected_source_auth.hostname | regex_replace('/+$', '') }}/api/controller/v2/job_templates/{{ item.json.results[0].id }}/survey_spec/
            headers:
              Authorization: "Bearer {{ aap_selected_source_auth.token }}"
            validate_certs: "{{ aap_validate_certs }}"
            ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
            follow_redirects: none
          loop: "{{ aap_selected_importer_lookups.results }}"
          register: aap_selected_importer_surveys
          no_log: true

        - name: Require bounded target prompts and keep generic project IDs fixed
          ansible.builtin.assert:
            that:
              - "['aap_instance_key', 'debug_logging'] | difference(item.json.spec | map(attribute='variable') | list) | length == 0"
              - >-
                item.item.item.playbook != 'deploy-cac-project.yml' or
                ['aap_config_repo_url', 'aap_config_file', 'aap_cac_project_id'] |
                intersect(item.json.spec | map(attribute='variable') | list) | length == 0
              - >-
                item.item.item.playbook != '05-prepare-use-cases.yml' or
                ['aap_selected_use_cases', 'aap_config_repo_url'] |
                difference(item.json.spec | map(attribute='variable') | list) | length == 0
            fail_msg: Update the seed importer surveys before running selected setup.
          loop: "{{ aap_selected_importer_surveys.results }}"
          no_log: true

        - name: Read the actual scoped credential associations on each importer
          ansible.builtin.uri:
            url: >-
              {{ aap_selected_source_auth.hostname | regex_replace('/+$', '') }}/api/controller/v2/job_templates/{{
              item.json.results[0].id }}/credentials/?page_size=200
            headers:
              Authorization: "Bearer {{ aap_selected_source_auth.token }}"
            validate_certs: true
            ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
            follow_redirects: none
          loop: "{{ aap_selected_importer_lookups.results }}"
          register: aap_selected_importer_credentials
          no_log: true

        - name: Verify the exact saved non-Machine credential boundaries
          ansible.builtin.assert:
            that:
              - item.json.next is none
              - >-
                (item.json.results | rejectattr('kind', 'equalto', 'ssh') | map(attribute='name') | sort | list) ==
                (cac_use_case_selector.importer_credentials[item.item.item.name] | sort | list)
            fail_msg: Reconcile the saved importer credential associations before selected setup.
          loop: "{{ aap_selected_importer_credentials.results }}"
          no_log: true

        - name: Require the registry's bound Machine credential identity
          ansible.builtin.assert:
            that:
              - aap_instance_route.hypervisor.machine_credential_name is string
              - aap_instance_route.hypervisor.machine_credential_name | length > 0
          no_log: true

        - name: Resolve only the bound Machine credential
          ansible.builtin.uri:
            url: >-
              {{ aap_selected_source_auth.hostname | regex_replace('/+$', '') }}/api/controller/v2/credentials/?name={{ item | urlencode }}&page_size=200
            headers:
              Authorization: "Bearer {{ aap_selected_source_auth.token }}"
            validate_certs: true
            ca_path: "{{ aap_seed_ca_path | default(omit, true) }}"
            follow_redirects: none
          loop:
            - "{{ aap_instance_route.hypervisor.machine_credential_name }}"
          register: aap_selected_route_credentials
          no_log: true

        - name: Require exact unique route credential identities and types
          ansible.builtin.assert:
            that:
              - item.json.count == 1
              - item.json.next is none
              - item.json.results[0].name == item.item
              - item.json.results[0].summary_fields.organization.name == aap_selected_setup_plan.organization
          loop: "{{ aap_selected_route_credentials.results }}"
          no_log: true

        - name: Verify the Machine binding while retaining the saved repository Git and Vault credentials
          ansible.builtin.assert:
            that:
              - aap_selected_route_credentials.results[0].json.results[0].kind == 'ssh'
          no_log: true

        - name: Prepare only the selected use-case prerequisites and verify completion
          ansible.builtin.include_tasks: tasks/selected-use-case-import.yml
          vars:
            aap_selected_importer: "{{ aap_selected_importer_lookups.results[0] }}"
            aap_selected_importer_key: prerequisites
            aap_selected_saved_credentials: "{{ aap_selected_importer_credentials.results[0].json.results }}"
            aap_selected_importer_extra:
              aap_selected_use_cases: "{{ aap_selected_use_cases }}"

        - name: Run each selected configuration importer without application jobs
          ansible.builtin.include_tasks: tasks/selected-use-case-import.yml
          loop: "{{ aap_selected_importer_lookups.results[1:] }}"
          loop_control:
            loop_var: aap_selected_importer
            index_var: aap_selected_importer_index
          vars:
            aap_selected_importer_key: "{{ aap_selected_importer.item.key }}"
            aap_selected_saved_credentials: "{{ aap_selected_importer_credentials.results[aap_selected_importer_index + 1].json.results }}"
            aap_selected_importer_extra: {}

        - name: Publish bounded completed configuration job results
          ansible.builtin.set_stats:
            data:
              selected_use_case_configuration: "{{ aap_selected_setup_results }}"
            aggregate: false
            per_host: false
      always:
        - name: Remove the private checkout on success or failure
          ansible.builtin.file:
            path: "{{ cac_workspace.path }}"
            state: absent
          when: cac_workspace.path is defined
