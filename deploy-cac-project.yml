---
- name: Import one reviewed project into an explicitly selected AAP instance
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - myvars
    - vars/main.yml
  vars:
    debug_logging: false
    dispatch_include_wildcard_vars: false
    aap_configuration_secure_logging: true
    controller_configuration_credentials_secure_logging: true
    gateway_users_secure_logging: true
  pre_tasks:
    - name: Derive the reviewed repository and encrypted capture before using any credentials
      ansible.builtin.set_fact:
        cac_project_contract: >-
          {{ aap_cac_project_id | default('') | aap_cac_project_contract(
               vault_cac_repository_namespace | default(git_url | regex_replace('/[^/]+/?$', ''))) }}
      no_log: true

    - name: Require an inventory AAP host and reject raw repository or file overrides
      ansible.builtin.assert:
        that:
          - aap_instance_key is defined
          - aap_instance_key is string
          - aap_instance_key in hostvars
          - aap_config_repo_url is not defined
          - aap_config_file is not defined
          - debug_logging is boolean or (debug_logging is string and (debug_logging | lower) in ['true', 'false'])
        fail_msg: Select an AAP inventory host; project, repository, and capture are fixed by the saved job template.
      no_log: true

    - name: Require the project-specific private Git credential
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'CAC_GIT_TOKEN') | length > 0
        fail_msg: Attach the project's CaC repository read token and Vault credential.
      no_log: true

    - name: Create a private temporary configuration workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: aap-project-cac-
      register: cac_workspace

    - name: Authenticate, load and import only this project's reviewed definitions
      block:
        - name: Authenticate through the selected target's verified API from this execution environment
          ansible.builtin.include_tasks: tasks/cac-api-auth.yml

        - name: Retrieve the fixed project capture with its private Git and Vault credentials
          ansible.builtin.include_tasks: tasks/cac-project-checkout.yml

        - name: Persist only selected AIOps data before creating credentials or rendering guest jobs
          ansible.builtin.include_tasks: tasks/cac-aiops-settings.yml
          vars:
            cac_aiops_settings_phase: pre
          when: cac_project_contract.project_id == 'aiops-selfhealing-demo'

        - name: Initialize the declared persistent-token placeholder before rendering resource definitions
          ansible.builtin.set_fact:
            "{{ cac_import_metadata.capabilities.eda_controller_access.token_variable }}": ''
          when: cac_import_metadata.capabilities.eda_controller_access is defined
          no_log: true

        - name: Require already prepared Windows public trust inputs without SSH discovery
          ansible.builtin.assert:
            that:
              - (vars | aap_cac_read_path(cac_import_metadata.capabilities.target_public_trust.ca_variable)) | length > 0
              - (vars | aap_cac_read_path(cac_import_metadata.capabilities.target_public_trust.known_hosts_variable)) | length > 0
            fail_msg: Prepare the target public CA bundle and SSH known-host data in the encrypted project configuration.
          when: cac_import_metadata.capabilities.target_public_trust is defined
          no_log: true

        - name: Require completed capture review and protected input values
          ansible.builtin.assert:
            that:
              - (cac_import_metadata | aap_cac_import_metadata(cac_project_contract.project_id)) is mapping
              - cac_import_metadata | aap_cac_validate_checks(vars)
          no_log: true

        - name: Normalize only this capture's explicitly mapped resource lists
          aap_cac_prepare_resources:
          no_log: true

        - name: Bind the selected resource lists without ambient wildcard merging
          ansible.builtin.set_fact:
            "{{ item.key }}": "{{ item.value }}"
          loop: "{{ cac_import_resources | dict2items }}"
          no_log: true

        - name: Validate every imported template's project label before making changes
          ansible.builtin.include_tasks: tasks/cac-template-labels.yml
          vars:
            cac_label_templates: "{{ controller_templates }}"
            cac_label_definitions: "{{ controller_labels }}"
            cac_required_template_label: "{{ cac_import_metadata.required_template_label }}"

        - name: Validate activation relationships and protected embedded configuration inputs
          ansible.builtin.assert:
            that:
              - cac_import_resources | aap_cac_validate_resources(cac_import_metadata)
          no_log: true

        - name: Check the dedicated service identity and permissions before changing resources
          aap_cac_lifecycle:
            operation: service_preflight
            authentication: "{{ cac_api_auth }}"
            contract: "{{ vars | aap_cac_read_path(cac_import_metadata.capabilities.inventory_service_access.contract_variable) }}"
            password: "{{ vars | aap_cac_read_path(cac_import_metadata.capabilities.inventory_service_access.password_variable) }}"
            resources: "{{ cac_import_resources }}"
          when: cac_import_metadata.capabilities.inventory_service_access is defined
          register: cac_service_preflight
          no_log: true

        - name: Preserve the password of an authenticated existing service user
          ansible.builtin.set_fact:
            aap_user_accounts: "{{ cac_service_preflight.resources.aap_user_accounts }}"
          when: cac_import_metadata.capabilities.inventory_service_access is defined
          no_log: true

        - name: Exclude the persistent EDA credential from ordinary masked-secret updates
          ansible.builtin.set_fact:
            eda_credentials: >-
              {{ eda_credentials | rejectattr('name', 'equalto',
                   cac_import_metadata.capabilities.eda_controller_access.credential_name) | list }}
          when: cac_import_metadata.capabilities.eda_controller_access is defined
          no_log: true

        - name: Import the shared resource types in dependency order
          ansible.builtin.include_tasks: tasks/cac-resource-definitions.yml

        - name: Require all configuration roles to have completed successfully
          ansible.builtin.assert:
            that:
              - aap_configuration_role_errors | default({}) | dict2items | selectattr('value', 'ne', []) | list | length == 0
            fail_msg: A configuration role reported errors; no workload was launched by this importer.
          no_log: true

        - name: Preserve native AIOps webhook and Event Stream data after the existing roles create them
          ansible.builtin.include_tasks: tasks/cac-aiops-settings.yml
          vars:
            cac_aiops_settings_phase: post
          when: cac_project_contract.project_id == 'aiops-selfhealing-demo'

        - name: Refresh selected AIOps saved runtime ciphertext after native resource readback
          aap_cac_prepare_resources:
          when: cac_project_contract.project_id == 'aiops-selfhealing-demo'
          no_log: true

        - name: Revalidate AIOps template labels after the accepted remote settings reread
          ansible.builtin.include_tasks: tasks/cac-template-labels.yml
          vars:
            cac_label_templates: "{{ cac_import_resources.controller_templates }}"
            cac_label_definitions: "{{ cac_import_resources.controller_labels }}"
            cac_required_template_label: "{{ cac_import_metadata.required_template_label }}"
          when: cac_project_contract.project_id == 'aiops-selfhealing-demo'

        - name: Recheck AIOps resource safety before reapplying saved ciphertext
          ansible.builtin.assert:
            that:
              - cac_import_resources | aap_cac_validate_resources(cac_import_metadata)
          when: cac_project_contract.project_id == 'aiops-selfhealing-demo'
          no_log: true

        - name: Save prepared AIOps runtime ciphertext through the existing Controller configuration role
          ansible.builtin.include_role:
            name: infra.aap_configuration.controller_job_templates
            apply:
              no_log: true
          vars:
            controller_templates: "{{ cac_import_resources.controller_templates }}"
          when: cac_project_contract.project_id == 'aiops-selfhealing-demo'
          no_log: true
      always:
        - name: Remove the private checkout without revoking the supplied API credential
          ansible.builtin.include_tasks: tasks/private-config-cleanup.yml
