---
- name: "Add target VM to inventory"
  hosts: localhost
  gather_facts: false
  tags: [always]
  vars_files:
    - myvars
  tasks:
    - name: Select the registered instance before any guest connection
      ansible.builtin.include_tasks: tasks/aap-instance-select.yml

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - vm_ip is defined
          - vm_name is defined
          - aap_instance_route | aap_instance_route is mapping
          - vm_ip == aap_instance_route.vm_ip
          - vm_name == aap_instance_route.vm_name
          - aap_hostname == aap_instance_route.aap_hostname
        fail_msg: "Required extra_vars: vm_ip, vm_name"

    - name: Validate an optional existing installer job identifier
      ansible.builtin.assert:
        that:
          - aap_installer_resume_job_id is string
          - aap_installer_resume_job_id is match('^j?[0-9]+\.[0-9]+$')
        fail_msg: Supply the async job identifier from the original installation job.
      when: aap_installer_resume_job_id is defined

    - name: Prepare strict guest trust through the pinned hypervisor
      ansible.builtin.include_tasks: tasks/aap-instance-ssh.yml

    - name: Add target VM to inventory
      ansible.builtin.add_host:
        name: target_vm
        ansible_host: "{{ vm_ip }}"
        vm_name: "{{ vm_name }}"
        vm_ip: "{{ vm_ip }}"
        aap_hostname: "{{ aap_hostname }}"
        aap_instance_route: "{{ aap_instance_route }}"
        ansible_port: 22
        ansible_user: "{{ vault_ansible_user }}"
        ansible_password: "{{ vault_ansible_password }}"
        ansible_become: true
        ansible_ssh_common_args: "{{ aap_instance_ssh_args }}"
        ansible_host_key_checking: true
        ansible_ssh_host_key_checking: true
      no_log: true


- name: "Prepare host for AAP installation"
  hosts: target_vm
  become: true
  gather_facts: false
  vars_files:
    - myvars
    - vars/main.yml

  pre_tasks:
    - name: Skip host preparation when observing an existing installer
      ansible.builtin.meta: end_play
      when: aap_installer_resume_job_id is defined

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Inspect the supported root layout before partition preparation
      ansible.builtin.command:
        argv: [findmnt, --json, --output, 'SOURCE,FSTYPE', /]
      register: aap_prepare_root_mount
      changed_when: false
      check_mode: false

    - name: Require the exact root partition and filesystem used by preparation
      ansible.builtin.assert:
        that:
          - aap_prepare_mounts | length == 1
          - aap_prepare_mounts[0].source == '/dev/sda4'
          - aap_prepare_mounts[0].fstype == 'xfs'
        fail_msg: Review this guest's root layout before filesystem preparation.
      vars:
        aap_prepare_mounts: "{{ (aap_prepare_root_mount.stdout | from_json).filesystems }}"

    - name: Grow root filesystem
      block:
        - name: Grow partition
          ansible.builtin.command:
            argv: [growpart, /dev/sda, '4']
          register: aap_partition_growth
          changed_when: aap_partition_growth.rc == 0
          failed_when: >-
            aap_partition_growth.rc != 0 and
            not (aap_partition_growth.rc == 1 and
                 'NOCHANGE:' in aap_partition_growth.stdout)

        - name: Grow XFS filesystem
          ansible.builtin.command:
            argv: [xfs_growfs, /]
          register: aap_xfs_growth
          changed_when: "'data blocks changed' in aap_xfs_growth.stdout"

    - name: Verify actual temporary capacity after filesystem preparation
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import os
            limits = {'/tmp': 10 * 1024**3, '/var/tmp': 3 * 1024**3}
            for path, needed in limits.items():
                values = os.statvfs(path)
                if values.f_bavail * values.f_frsize < needed:
                    raise SystemExit('Insufficient installation temporary space after preparation.')
      changed_when: false
      check_mode: false

    - name: Subscribe to RHEL and enable AAP repository
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.rhc
      vars:
        rhc_state: present
        rhc_auth:
          activation_keys:
            keys:
              - "{{ vault_rhsm_activation_key }}"
        rhc_organization: "{{ vault_rhsm_org_id }}"
        rhc_repositories:
          - name: ansible-automation-platform-2.7-for-rhel-9-x86_64-rpms
            state: enabled

    - name: Add FQDN to /etc/hosts so installer resolves locally
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ vm_ip }}  {{ vm_name }}  {{ aap_hostname | ansible.builtin.urlsplit('hostname') }}"
        regexp: "{{ vm_name }}"

    - name: Install the native AAP installer and EE image-copy tools
      # Skopeo is a receiving-VM OS prerequisite for its own Hub EE build.
      # Use the existing subscribed RHEL repositories and normal DNF trust policy.
      ansible.builtin.dnf:
        name: [ansible-core, skopeo]
        state: present


- name: "Configure and install AAP"
  hosts: target_vm
  become: true
  become_user: "{{ vault_aap_install_user }}"
  gather_facts: false
  vars_files:
    - myvars
    - vars/main.yml
  vars:
    installer_dir_name: "ansible-automation-platform-containerized-setup-bundle-{{ aap_version }}-x86_64"
    aap_installer_hostname: "{{ aap_hostname | ansible.builtin.urlsplit('hostname') }}"
    source_aap_fqdn: "aap.{{ vault_domain }}"
    aap_installer_ca_path: "/home/{{ vault_aap_install_user }}/aap/tls/extracted/pem/directory-hash/ca-bundle.crt"

  tasks:
    - name: Start a new AAP installation
      when: aap_installer_resume_job_id is not defined
      block:
        - name: Replace hostname in inventory
          ansible.builtin.replace:
            path: "{{ installer_extract_dir }}/{{ installer_dir_name }}/inventory"
            regexp: "{{ source_aap_fqdn }}"
            replace: "{{ aap_installer_hostname }}"

        - name: Set bundle install in inventory
          ansible.builtin.lineinfile:
            path: "{{ installer_extract_dir }}/{{ installer_dir_name }}/inventory"
            line: "{{ item }}"
            insertafter: '\[all:vars\]'
          loop:
            - "bundle_install=true"
            - "bundle_dir={{ installer_extract_dir }}/{{ installer_dir_name }}/bundle"

        - name: Set the supported Hub worker timeout in installer inventory
          # Replace the winning assignment rather than appending behind a stale timeout.
          ansible.builtin.lineinfile:
            path: "{{ installer_extract_dir }}/{{ installer_dir_name }}/inventory"
            regexp: '^\s*hub_gunicorn_timeout\s*='
            line: "hub_gunicorn_timeout={{ aap_hub_gunicorn_timeout | int }}"
            insertafter: '\[all:vars\]'

        - name: Run AAP installer
          ansible.builtin.command:
            cmd: ansible-playbook -i inventory ansible.containerized_installer.install
            chdir: "{{ installer_extract_dir }}/{{ installer_dir_name }}"
          async: 7200
          poll: 30
          changed_when: true

    - name: Observe the existing AAP installer without launching another
      when: aap_installer_resume_job_id is defined
      block:
        - name: Wait for the existing installer result
          ansible.builtin.async_status:
            jid: "{{ aap_installer_resume_job_id }}"
          register: aap_installer_resumed
          until: aap_installer_resumed.finished | default(false) | bool
          retries: 240
          delay: 30
          failed_when: false
          no_log: true

        - name: Require the existing installer to have completed successfully
          ansible.builtin.assert:
            that:
              - aap_installer_resumed.rc is defined
              - aap_installer_resumed.rc | int == 0
            fail_msg: >-
              The existing installer did not report success
              (return code {{ aap_installer_resumed.rc | default('unavailable') }}).
              Inspect its protected logs before retrying installation.

    - name: Verify the installed Gateway against its authenticated local CA
      tags: [aap_upstream_tls]
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/ping/"
        ca_path: "{{ aap_installer_ca_path }}"
        validate_certs: true
        follow_redirects: none
      register: aap_ping
      retries: 12
      delay: 10
      until: aap_ping.status == 200

    - name: Publish only a verified upstream after successful installation
      ansible.builtin.include_tasks:
        file: tasks/aap-upstream-trust.yml
        apply:
          tags: [aap_upstream_tls]
      tags: [aap_upstream_tls]

    - name: Verify the public Gateway through the trusted proxy
      tags: [aap_upstream_tls]
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/ping/"
        validate_certs: true
        follow_redirects: none
        status_code: 200
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
      register: aap_public_ping

    - name: Require an actual Controller response through the verified upstream
      tags: [aap_upstream_tls]
      ansible.builtin.assert:
        that:
          - aap_public_ping.json.version is defined
          - aap_public_ping.json.version | length > 0
